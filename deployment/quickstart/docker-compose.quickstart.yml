# The quickstart: one Kafka broker, some data in it, and KUI pointed at it.
#
# THIS IS A DEMONSTRATION ENVIRONMENT, NOT A PRODUCTION DEPLOYMENT. The broker speaks plain text
# with no authentication and no encryption, and KUI serves its session cookie without `Secure` so
# that plain HTTP on localhost works. Both are wrong anywhere a network can reach them.
# Published ports therefore bind loopback unless KUI_QUICKSTART_BIND_ADDRESS is explicitly set.
#
# Do not run this file by hand — run `deployment/quickstart/quickstart.sh`, which builds the KUI
# image if it is missing and then calls this file. The script is the documented entry point; this
# file is what it drives.

name: kui-quickstart

services:
  # ---------------------------------------------------------------------------------------------
  # Kafka 4.3.1, one node, KRaft mode: it is its own controller and there is no ZooKeeper.
  #
  # Why this exact version rather than a floating tag such as `apache/kafka:latest`: a quickstart
  # that pulls whatever was published this morning is a quickstart that can break without anybody
  # changing a line of KUI, and the failure lands on the one person least equipped to debug it — a
  # newcomer running the project for the first time. 4.3.1 is a patch release of the current 4.x
  # line, which is the first Kafka series that removed ZooKeeper entirely, so this is a modern
  # broker rather than a KRaft-mode-enabled old one. It is `apache/kafka`, the image the Apache
  # Kafka project publishes itself, and it carries the command-line tools the seed step uses.
  # ---------------------------------------------------------------------------------------------
  kafka:
    image: apache/kafka:4.3.1
    container_name: kui-quickstart-kafka
    ports:
      # Published so you can point your own console tools, kcat, or an IDE at the same broker.
      # KUI does not use this route; it reaches the broker over the private network below.
      - "${KUI_QUICKSTART_BIND_ADDRESS:-127.0.0.1}:${KUI_QUICKSTART_KAFKA_PORT:-9092}:29092"
    environment:
      # A fixed cluster id. Generating one per run would work, but a fixed value means the broker
      # formats its storage identically on every machine, which makes a support question about it
      # answerable.
      CLUSTER_ID: kui-quickstart-0000000001

      # One node that is both broker and controller. `KAFKA_CONTROLLER_QUORUM_VOTERS` names the
      # quorum: node 1, reachable at kafka:9093. With a single node it is a quorum of one.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Three listeners, because the address a client must be told to use depends on where the
      # client is. A container on this network resolves `kafka`; a program on your laptop cannot,
      # and resolves `localhost` instead. A Kafka client always reconnects to the address the
      # broker advertises, not the one it was given, so advertising the wrong one produces the
      # classic failure where the first connection succeeds and every later one times out.
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KUI_QUICKSTART_KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      # Single node, so every internal topic has to be happy with one replica. The defaults are 3
      # and the broker refuses to create the consumer-offsets topic without them.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      # Do not wait three seconds for other consumers to join a group that will never have any.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Remote JMX, for the `kafka-metrics` exporter below and for nothing else.
      #
      # Kafka publishes its own throughput as JMX meters and offers no other way to read them, so
      # without these two lines the broker is unmeasurable, `kui.metrics.sources` has nothing to
      # name, and the dashboard's Throughput card correctly says it cannot measure anything — which
      # is indistinguishable from KUI not being able to. No port is published to the host: an
      # unauthenticated JMX server is a remote-code-execution primitive, and this one is reachable
      # only from the private network at the bottom of this file.
      #
      # `KAFKA_JMX_PORT` and `KAFKA_JMX_HOSTNAME` rather than a hand-written `KAFKA_JMX_OPTS`, and
      # the difference is not style. `kafka-run-class.sh` applies `KAFKA_JMX_OPTS` to *every* tool
      # it launches, so a hand-written one with a fixed port makes this container's own healthcheck
      # — which runs `kafka-topics.sh` in here — fail to start on a port the broker already holds.
      # These two are read by the image's `launch` script, which exports the flags into the broker's
      # process alone.
      #
      # The hostname is the part everybody forgets. An RMI registry answers with a *stub* naming the
      # address to call back on, and the image defaults that to the container's own bridge IP; the
      # exporter then connects to the registry and hangs on the second hop. `kafka` is the name that
      # resolves on this network from both sides.
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka

      # No log directory is mounted, on purpose: the broker keeps its data inside the container's
      # own writable layer, so removing the container removes the data and there is no volume left
      # behind for anyone to find months later. A quickstart's data is a demonstration, not
      # something to preserve.
    healthcheck:
      # THE IMPORTANT LINE IN THIS FILE. A Kafka container reports itself started long before it
      # can answer a metadata request: the process is up, the port accepts connections, and the
      # controller has not yet finished electing itself and publishing the cluster's metadata. A
      # TCP check, or Compose's plain `depends_on`, is satisfied at that moment, and anything that
      # connects then gets its request refused or times out.
      #
      # `kafka-topics.sh --list` is a real metadata request over the real client protocol, so it
      # cannot pass until the broker can actually serve a client. That is the difference between
      # "started" and "ready", and it is why the seed step and KUI wait on this and not on a port.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 15s
    networks:
      - kui-quickstart
    restart: unless-stopped

  # ---------------------------------------------------------------------------------------------
  # The thing that makes this deployment measurable: a Prometheus JMX exporter, standalone, beside
  # the broker.
  #
  # KUI reads broker throughput from a Prometheus text-exposition endpoint and cannot read JMX
  # (ADR-050). That is not an omission: `MetricsSourceSettings.url` is a `SafeUrl`, restricted to
  # `http` and `https` by ARCHITECTURE.md §14, so `service:jmx:rmi:///jndi/rmi://kafka:9999/jmxrmi`
  # cannot be written into a KUI configuration at all. This container is the bridge, and
  # `kui-quickstart.yaml` names its address under `kui.metrics.sources.quickstart`.
  #
  # `soldevelo/jmx-exporter:1.4.0`: in 2025 Bitnami moved its free catalogue to the frozen
  # `bitnamilegacy` namespace. SolDevelo publishes maintained builds from its public Bitnami fork,
  # and the version stays pinned for the same reason `apache/kafka:4.3.1` is pinned above: a
  # quickstart that pulls whatever was published this morning can break for a newcomer without
  # anybody touching KUI.
  #
  # NO PUBLISHED PORT. The exposition is for KUI, not for a person; a metrics endpoint on the host
  # would invite somebody to point their own Prometheus at it and conclude that this is how KUI is
  # monitored, which is the opposite of what ADR-009 says. To read it by hand:
  #
  #   docker compose -f deployment/quickstart/docker-compose.quickstart.yml exec kui curl -s \
  #     http://kafka-metrics:5556/metrics
  # ---------------------------------------------------------------------------------------------
  kafka-metrics:
    image: soldevelo/jmx-exporter:1.4.0
    container_name: kui-quickstart-kafka-metrics
    # Port first, configuration second: that is the standalone jar's argument order, and the image's
    # own default command is `5556 examples/standalone_sample_config.yml`, which would export a
    # sample of somebody else's JVM.
    command: ["5556", "/etc/jmx-exporter/kafka-jmx-exporter.yml"]
    depends_on:
      kafka:
        # The exporter dials JMX at startup and does not retry the initial connection quickly, so
        # starting it against a broker that is still electing itself costs the first minute of
        # samples — which is the whole of what a two-minute browser run would have to draw.
        condition: service_healthy
    volumes:
      - ../metrics/kafka-jmx-exporter.yml:/etc/jmx-exporter/kafka-jmx-exporter.yml:ro
    healthcheck:
      # The exposition itself, not the port: the jar answers on 5556 before it has connected to
      # JMX, and a body with no `kafka_server_` family in it is an exporter that is running and
      # measuring nothing — which is exactly the state this whole packet exists to make visible.
      #
      # bash's `/dev/tcp` and not curl, because this image carries neither curl nor wget. It is the
      # smallest honest HTTP request: open the socket, ask for the document, and require the family
      # KUI parses to be in the answer.
      #
      # `CMD` naming bash explicitly, not `CMD-SHELL`: Compose's shell form runs `/bin/sh -c`, which
      # on this Debian base is dash, and dash has no `/dev/tcp`. Written as `CMD-SHELL` the check
      # fails on every deployment and reports the exporter permanently unhealthy while it is serving
      # perfectly — which is how it was first written here.
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/5556 && printf 'GET /metrics HTTP/1.0\r\n\r\n' >&3 && grep -q kafka_server_brokertopicmetrics_bytesinpersec <&3"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    networks:
      - kui-quickstart
    restart: unless-stopped

  # ---------------------------------------------------------------------------------------------
  # A Kafka Connect worker, so that the Connect screens have a real worker to be honest about.
  #
  # It is the stock `apache/kafka` image running `connect-distributed.sh` -- the same image this
  # file already pulls three times over for the broker and the two seeders -- so it adds a container
  # and no download. The shipped `connect-distributed.properties` already sets every
  # `*.storage.replication.factor` to 1, which is what this single-node broker needs, so the only
  # things rewritten are `bootstrap.servers` and the group the three internal topics are coordinated
  # under. The rewrite goes to /tmp rather than into a mounted properties file because a second
  # configuration file in this directory would be one more thing `ShippedConfigurationSuite` has to
  # be told is not KUI's own.
  #
  # ONE CONNECTOR RUNS ON IT, AND THIS COMMENT USED TO SAY THE OPPOSITE. It said "nothing registers
  # a connector and nothing should", on the argument that a worker running zero connectors is one of
  # three answers the Connect screens must not confuse -- `not_configured`, a refusal, and `ok` with
  # an empty list -- and that seeding one would erase the distinction. The distinction is real and
  # the conclusion was wrong: `frontend/e2e/connect.spec.ts` has two positive cases, a connector's
  # rows and a task's state, and both of them SKIP on this stack because there is nothing to list.
  # The empty-worker answer is still covered, one directory over, by `deployment/compose`, whose own
  # worker runs nothing and whose `smoke.sh` asserts that shape. The two stacks now hold the two
  # states between them, and the state nothing covered was the one every real deployment is in.
  # `./seed/connect-seed.sh` is what registers it, and it is the `connect-seed` service below.
  #
  # THE REST PORT IS PUBLISHED, and it was not before. The exporter above keeps its port to itself
  # because its exposition is for KUI and there is nothing to compare it against; this worker is now
  # the one container in the quickstart whose facts KUI *re-renders*, so being able to read the
  # worker's own answer beside the screen's is the whole way anybody checks the screen is honest:
  #
  #   curl -s localhost:${KUI_QUICKSTART_CONNECT_PORT:-8083}/connectors/quickstart-file-source
  #
  # It is a variable with a default, like every other published port here, so a machine already
  # running something on 8083 moves it rather than losing the quickstart.
  # ---------------------------------------------------------------------------------------------
  kafka-connect:
    image: apache/kafka:4.3.1
    container_name: kui-quickstart-kafka-connect
    ports:
      - "${KUI_QUICKSTART_BIND_ADDRESS:-127.0.0.1}:${KUI_QUICKSTART_CONNECT_PORT:-8083}:8083"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        sed -e 's|^bootstrap.servers=.*|bootstrap.servers=kafka:9092|' \
            -e 's|^group.id=.*|group.id=kui-quickstart-connect|' \
            /opt/kafka/config/connect-distributed.properties > /tmp/connect-distributed.properties
        # THE FileStream CONNECTORS ARE IN THIS IMAGE AND NOT ON ITS CLASSPATH. `connect-file-*.jar`
        # ships in /opt/kafka/libs, but `connect-distributed.sh` builds a classpath that leaves it
        # out -- the jar is absent from the `jvm.classpath` the worker logs at startup -- so one
        # started with no `plugin.path` answers `Failed to find any class that implements Connector
        # and which name matches org.apache.kafka.connect.file.FileStreamSourceConnector` and lists
        # only the three MirrorMaker connectors. Measured here, against this image, on the 400 the
        # connector seed got back.
        #
        # So the jar is copied into a directory of its own and that directory is the plugin path.
        # Copied rather than named in `plugin.path` directly, because the jar's name carries the
        # Kafka version and this file should not have to be edited when the image tag moves; the
        # glob is what makes it version-agnostic.
        mkdir -p /tmp/connect-plugins/file
        cp /opt/kafka/libs/connect-file-*.jar /tmp/connect-plugins/file/
        printf 'listeners=http://:8083\nplugin.discovery=hybrid_warn\n' \
          >> /tmp/connect-distributed.properties
        printf 'plugin.path=/tmp/connect-plugins\n' >> /tmp/connect-distributed.properties
        exec /opt/kafka/bin/connect-distributed.sh /tmp/connect-distributed.properties
    healthcheck:
      # A real GET of the resource KUI reads, not a port check: Jetty accepts connections before
      # Connect has finished publishing its routes. bash's `/dev/tcp` and `CMD` naming bash
      # explicitly, for the reason spelled out on the exporter above -- this image has no curl, and
      # Compose's `CMD-SHELL` runs dash, which has no `/dev/tcp`.
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/8083 && printf 'GET /connectors HTTP/1.0\r\n\r\n' >&3 && grep -q '200 OK' <&3"
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 15s
    networks:
      - kui-quickstart
    restart: unless-stopped

  # ---------------------------------------------------------------------------------------------
  # A ksqlDB server, so that the ksqlDB screens have a real server to be honest about.
  #
  # IT IS THE ONE IMAGE IN THIS FILE THAT IS NOT APACHE-2.0, and that is worth saying out loud
  # rather than leaving for somebody to discover. ADR-014 Amendment 1 chose Apicurio over
  # Confluent's Schema Registry to keep this quickstart on Apache-licensed images, and it could,
  # because two implementations of that REST API exist. There is no second implementation of
  # ksqlDB: `confluentinc/ksqldb-server` under the Confluent Community License is the only thing
  # that speaks it. KUI's own code depends on the API and not on this server.
  #
  # It is also the one container here that is a real extra download -- every other image in this
  # file is the Kafka image, the registry image or KUI's own, each pulled once. That cost buys the
  # ksqlDB screens something to show; without it every one of them would be a refusal, which is the
  # state the Connect screens were in for two waves.
  #
  # `KSQL_KSQL_SERVICE_ID` prefixes the internal command topic: two servers on one broker sharing an
  # id share a command topic and are one cluster. The replication and min-ISR settings are here
  # because this broker is a single node.
  # ---------------------------------------------------------------------------------------------
  ksqldb-server:
    image: confluentinc/ksqldb-server:0.29.0
    container_name: kui-quickstart-ksqldb
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      # Published for the reason the registry's port is: so the server KUI is reading can be asked
      # the same question by hand, which is how anybody checks a screen is honest.
      - "${KUI_QUICKSTART_BIND_ADDRESS:-127.0.0.1}:${KUI_QUICKSTART_KSQL_PORT:-8088}:8088"
    environment:
      KSQL_BOOTSTRAP_SERVERS: kafka:9092
      KSQL_LISTENERS: http://0.0.0.0:8088
      KSQL_KSQL_SERVICE_ID: kui-quickstart-
      KSQL_KSQL_STREAMS_REPLICATION_FACTOR: 1
      KSQL_KSQL_INTERNAL_TOPIC_REPLICAS: 1
      KSQL_KSQL_INTERNAL_TOPIC_MIN_INSYNC_REPLICAS: 1
    healthcheck:
      # A real GET of `/info`, which is the resource KUI's adapter reads first, and not a port
      # check: Jetty accepts connections well before the engine has started. This image is
      # Debian-based and carries curl.
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/info"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 20s
    networks:
      - kui-quickstart
    restart: unless-stopped

  # ---------------------------------------------------------------------------------------------
  # A one-shot container that creates one ksqlDB stream over a seeded topic, then exits.
  #
  # Same argument as `connect-seed` below it: a ksqlDB server that knows about nothing renders as an
  # empty list, which is honest and is the only state anything would cover. One stream gives the
  # object listing a row, the statement screen something to describe, and a push query something to
  # select from.
  # ---------------------------------------------------------------------------------------------
  ksql-seed:
    image: apicurio/apicurio-registry:3.0.6
    container_name: kui-quickstart-ksql-seed
    depends_on:
      ksqldb-server:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "/seed/ksql-seed.sh"]
    environment:
      KUI_KSQL_URL: http://ksqldb-server:8088
    volumes:
      - ./seed:/seed:ro
    restart: "no"
    networks:
      - kui-quickstart

  # ---------------------------------------------------------------------------------------------
  # A one-shot container that puts one connector onto the worker above, then exits.
  #
  # It runs the registry's image and not `apache/kafka` for the reason `schema-seed.sh` records in
  # full: this script talks HTTP and nothing else, so it needs `curl`, and the Kafka image is
  # Alpine with busybox `wget` and no `curl` at all. The registry image is already being pulled by
  # this same file.
  #
  # `service_completed_successfully` is what `kui` waits on below, so the first look at the Connect
  # screen shows the connector rather than the ten seconds during which it is UNASSIGNED. The script
  # itself does not exit until the connector and its task both report RUNNING, which is what makes
  # that wait worth anything.
  # ---------------------------------------------------------------------------------------------
  connect-seed:
    image: apicurio/apicurio-registry:3.0.6
    container_name: kui-quickstart-connect-seed
    depends_on:
      kafka-connect:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/seed/connect-seed.sh"]
    environment:
      KUI_CONNECT_URL: http://kafka-connect:8083
    volumes:
      - ./seed:/seed:ro
    networks:
      - kui-quickstart
    # Same reasoning as `seed` below: the script is safe to re-run -- it PUTs the configuration
    # rather than POSTing it -- but a restart loop hiding a real failure is worse than a container
    # that stopped and said why.
    restart: "no"

  # ---------------------------------------------------------------------------------------------
  # A one-shot container that puts something worth looking at into the broker, then exits.
  #
  # The script, the topic table and the message files all live in ./seed; see ./seed/README.md for
  # what it creates and why. It runs in the stock Kafka image because that image already carries
  # Kafka's shell tools, so the quickstart never has to build or pull a second image.
  # ---------------------------------------------------------------------------------------------
  seed:
    image: apache/kafka:4.3.1
    container_name: kui-quickstart-seed
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/seed/seed.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./seed:/seed:ro
    networks:
      - kui-quickstart
    # A seed that failed and was restarted would seed twice. It is written to be safe to re-run,
    # but a restart loop hiding a real error is worse than a visible failure.
    restart: "no"

  # ---------------------------------------------------------------------------------------------
  # A Schema Registry, so that the quickstart has a topic KUI has to decode rather than read.
  #
  # Why this image. Apicurio Registry implements the same REST API Confluent's registry publishes —
  # KUI talks to it at `/apis/ccompat/v7`, which is the compatibility endpoint — and it is
  # Apache-2.0 throughout, which Confluent's own image is not (ADR-014 Amendment 1 records why that
  # distinction is worth keeping even for a demo). Anything that speaks the same API works here;
  # KUI has no dependency on which one an operator runs.
  #
  # Its storage is in memory, which is right for a throwaway: restarting this container loses the
  # registered schemas, and the schema seed below re-registers them. Nothing a person clicks in KUI is
  # kept in the registry, so nothing they did is lost with it.
  # ---------------------------------------------------------------------------------------------
  schema-registry:
    image: apicurio/apicurio-registry:3.0.6
    container_name: kui-quickstart-schema-registry
    environment:
      QUARKUS_PROFILE: prod
    ports:
      # Published so you can look at the same registry KUI is reading, with curl or a browser.
      - "${KUI_QUICKSTART_BIND_ADDRESS:-127.0.0.1}:${KUI_QUICKSTART_REGISTRY_PORT:-8081}:8080"
    healthcheck:
      # A real call to the API KUI uses, not a port check: the process accepts connections well
      # before Quarkus has finished publishing its routes, and a port check passes in that window.
      test:
        ["CMD-SHELL", "curl -fsS http://localhost:8080/apis/ccompat/v7/subjects >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    networks:
      - kui-quickstart
    restart: unless-stopped

  # ---------------------------------------------------------------------------------------------
  # The one consumer group that is actually alive.
  #
  # seed.sh can write the committed offsets of a group that has STOPPED, because a stopped group is
  # nothing but those offsets sitting in Kafka. It cannot fake a RUNNING one: a group has members
  # only while some process is holding a session open with the broker, and a seed job exits. So the
  # live group is a container that keeps running and reads a topic forever.
  #
  # It matters because the two states look completely different on a consumer-groups screen, and a
  # newcomer who only ever sees dead groups has no idea which of them is the broken one.
  # ---------------------------------------------------------------------------------------------
  consumer:
    image: apache/kafka:4.3.1
    container_name: kui-quickstart-consumer
    depends_on:
      seed:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "/seed/consume.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./seed:/seed:ro
    networks:
      - kui-quickstart
    restart: unless-stopped

  # ---------------------------------------------------------------------------------------------
  # KUI itself, in its all-in-one shape: the gateway and every service in one process (ADR-005).
  # The distributed shape lives in ../compose/docker-compose.yml and exists to demonstrate fault
  # isolation between processes; a newcomer does not need three containers to see the product.
  # ---------------------------------------------------------------------------------------------
  kui:
    image: kui-allinone:${KUI_VERSION:-0.1.0-SNAPSHOT}
    # Built from source, because KUI's images are not published to a registry yet. Without this
    # stanza `docker compose up` fails on the very first thing it does: the image name resolves to
    # nothing, Docker asks the registry, and the registry has never heard of it. The quickstart's
    # own README said so and the compose file did not act on it, so the documented command could
    # not work — which is the worst kind of broken, because the reader concludes the product is.
    #
    # The context is the repository root, four levels up, because the build stage runs `./mill` over
    # the whole source tree. `Dockerfile.dockerignore` beside the Dockerfile is what keeps that
    # context from including `out/`, `.git` and every `node_modules`.
    #
    # `docker compose up` reuses an image that already exists; `docker compose up --build` forces a
    # rebuild. The first run of either builds it.
    build:
      context: ../..
      dockerfile: deployment/quickstart/Dockerfile
    container_name: kui-quickstart-kui
    command: ["--config", "/etc/kui/kui-quickstart.yaml"]
    ports:
      - "${KUI_QUICKSTART_BIND_ADDRESS:-127.0.0.1}:${KUI_PORT:-8080}:8080"
    environment:
      # Human-readable log lines. The images default to one JSON object per line, which is right
      # for a log collector and unreadable for the person who just ran the quickstart.
      KUI_TELEMETRY_LOGFORMAT: text

      # Demo-only deterministic AES-256 key for KUI's compacted metadata topics. Keeping it stable
      # across container recreation is the feature under demonstration. Override it with 32 random
      # bytes encoded as base64 when retaining this broker; never reuse this public default outside
      # the quickstart.
      KUI_STORE_ENCRYPTION_KEY: ${KUI_STORE_ENCRYPTION_KEY:-a3VpLXF1aWNrc3RhcnQtZGVtby1rZXktMDAwMDAwMDE=}

      # The schema registry below lives on this Compose network, which is a private address, and
      # KUI refuses to call a private or loopback address unless this is set (ARCHITECTURE.md §14:
      # the address rule exists to stop KUI being pointed at a cloud metadata service). A
      # quickstart is exactly the deployment the relaxation was written for.
      KUI_ALLOW_PRIVATE_UPSTREAMS: "true"
    volumes:
      - ./kui-quickstart.yaml:/etc/kui/kui-quickstart.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        # KUI probes the registry once per cluster while it builds its serdes, and reports the
        # result in the serde picker. Waiting here means the first look at the picker shows the
        # registry working rather than the outage it was in for the first two seconds.
        condition: service_healthy
        required: false
      kafka-connect:
        # Ordered, not gated, exactly like the registry above. KUI reads the worker when a Connect
        # screen is opened rather than at start-up, so waiting here buys only that the first look at
        # the screen shows the worker answering instead of the twenty seconds it spends starting.
        condition: service_healthy
        required: false
      ksql-seed:
        # And that the ksqlDB server knows about its one stream by then, for the same reason.
        condition: service_completed_successfully
        required: false
      connect-seed:
        # And that the worker has its connector on it by then, for the same reason the data seed
        # below is waited on: the first Connect screen a newcomer opens should be the one this
        # quickstart is demonstrating, not the empty one it passes through on the way. Not gated --
        # a failed seed leaves a worker running nothing, which the screens render honestly and which
        # is a better outcome than KUI refusing to start.
        condition: service_completed_successfully
        required: false
      seed:
        # Wait for the data to be there, so the first screen is never a half-seeded cluster.
        condition: service_completed_successfully
        # But do not refuse to start KUI when seeding failed. KUI's whole design position is that
        # it stays up and reports what is broken rather than disappearing along with it; a
        # quickstart that showed nothing at all because a topic could not be created would be
        # contradicting the product it is demonstrating.
        required: false
    networks:
      - kui-quickstart
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------------------------
  # The schema-aware half of the demonstration, which runs last because it needs everything else.
  #
  # It registers Avro, JSON Schema and Protobuf subjects and writes records through KUI's produce
  # API. The first two exercise KUI's registry serializer; Protobuf uses Hex because KUI supports
  # decoding but deliberately refuses to claim it can encode Protobuf yet. All three then exercise
  # the same registry-aware read and field-filter paths in the message browser.
  # ---------------------------------------------------------------------------------------------
  avro-seed:
    # The registry's own image, and not `apache/kafka` like the other two seed containers, for one
    # blunt reason: this script talks to KUI and to the registry over HTTP and nothing else, so it
    # needs `curl`, and the Apache Kafka image does not carry `curl` at all. It was written against
    # `apache/kafka:4.3.1` on the assumption that a Linux image has `curl`; that image is Alpine
    # with busybox `wget` and no `curl`, so every run of the quickstart failed here with
    # `curl: command not found` and no Avro records were ever produced. The registry image is
    # already being pulled by this same file, has bash, curl and sed, and adds no download.
    image: apicurio/apicurio-registry:3.0.6
    container_name: kui-quickstart-avro-seed
    depends_on:
      schema-registry:
        condition: service_healthy
      kui:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/seed/schema-seed.sh"]
    environment:
      KUI_BASE_URL: http://kui:8080
      KUI_CLUSTER_ID: quickstart
      KUI_REGISTRY_URL: http://schema-registry:8080/apis/ccompat/v7
    volumes:
      - ./seed:/seed:ro
    networks:
      - kui-quickstart
    restart: "no"

networks:
  kui-quickstart:
    driver: bridge
