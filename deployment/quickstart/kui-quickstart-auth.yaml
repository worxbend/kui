# The quickstart's KUI configuration, WITH A LOGIN.
#
# This is ./kui-quickstart.yaml with two blocks filled in — `kui.auth` and `kui.rbac` — and three
# deliberate omissions, listed below. It exists so that "authentication works" is something you can
# see rather than something a document claims, and so that the difference between the default (no
# login at all) and this one is a diff of two files rather than a paragraph.
#
# THE SENTENCE HERE USED TO END "and nothing else changed", AND IT WAS FALSE IN FOUR PLACES.
# `diff kui-quickstart.yaml kui-quickstart-auth.yaml` is the command that settles it, and it is
# worth running before editing either file. What actually differs, measured rather than remembered:
#
#   * `kui.auth` and `kui.rbac`, which is what this file is for.
#   * NO `ksql` BLOCK on the cluster below. `--with-auth` starts the same containers as the default
#     quickstart, ksqlDB included, but this file does not point at it, so the ksqlDB screens are
#     hidden here by ADR-032's rule. Wave 11 recorded that as drift and left it rather than repair
#     it blind; WAVE 12 DECIDED IT AGAINST A RUNNING STACK, AND THE DECISION IS TO LEAVE THE BLOCK
#     OUT AND STOP CALLING IT AN ACCIDENT.
#
#     The reason is one nobody had measured. `ksql.objects` declares
#     `ResourceRequirement.unnamed(Resource.Ksql, Action.KsqlView)` and NEITHER ROLE BELOW CARRIES A
#     `KSQL` PERMISSION, so the fold refuses it before the capability is ever consulted. Measured
#     here on 2026-09-12, signed in as `admin` through the form, against a stack
#     `quickstart.sh --with-auth` had just built:
#
#       GET /api/v1/clusters/quickstart/ksql/objects   ->  403 KUI-FORBIDDEN
#
#     — and that is with NO ksqlDB configured at all, where an unconfigured feature is supposed to
#     answer 200 `not_configured`. Adding the block would therefore buy a configured feature whose
#     first screen is a 403 for BOTH accounts, which is worse than the row being hidden.
#
#     Making it work is two edits and not one — the block, and a `KSQL` permission on `operators` —
#     and that is a change to what this deployment demonstrates, which is authorization. The
#     `connect` block that IS here is the instructive contrast, and it was measured in the same
#     pass: `connect.list` stays 200, because ADR-021 keeps Kafbat's rule that a list filters rather
#     than refuses. The signed-in `admin` holds no `CONNECTOR` or `CONNECT` `VIEW`, so the answer
#     names no connector and no task trace. The same account gets 403 on
#     `.../connectors/quickstart-file-source/pause`, which requires `Resource.Connect` with
#     `OPERATE`. The 2026-09-12 measurement that the list body contained `quickstart-file-source
#     RUNNING` recorded the missing row filter: cluster scope was treated as permission to see every
#     connector. Filed for the next wave through W12-01: `operators` either grows the
#     permissions that make its own comment true — `CONNECT`, `CONNECTOR`, `KSQL`, `METRICS`,
#     `ALERTS` — and the `ksql` block lands with it and somebody signs in and looks, or the roles
#     stay as they are and both features are described the way they now are below. **It is one
#     decision about what this file demonstrates, and it is not a repair-wave decision.**
#   * NO SECOND REGISTERED CLUSTER. The default file registers `staging-eu-01` over the same broker
#     so that the cluster selector has something to switch to; this one registers `quickstart`
#     alone, so the roles below name one cluster and the selector has one row.
#   * The `connect` comment, which said the worker ran no connectors. Both files configure the same
#     worker and `--with-auth` runs the same `connect-seed` container, so it runs one. Corrected in
#     wave 11; the comment is now the only thing that differs there, and it differs by saying so.
#
# And ONE thing that used to differ and no longer does, because it was a hole rather than a
# decision: the `masking` block, added in wave 11. See its own comment below.
#
# Run it with:
#
#     deployment/quickstart/quickstart.sh --with-auth
#
# Then sign in as either of:
#
#     admin  / quickstart-admin     may do everything to this cluster's topics, groups, schemas
#                                   and connection settings
#     viewer / quickstart-viewer    may look at topics and read records, and nothing else
#
# Signed in as `viewer`, the create-topic button, the topic-configuration editor, "Add partitions",
# "Empty topic" and "Delete topic" are ON the screen and DISABLED, each carrying the sentence that
# says why — *"You do not have permission to create a topic on this cluster."* THIS PARAGRAPH SAID
# THE OPPOSITE UNTIL WAVE 12 — "they are not disabled, they are absent" — and `quickstart.sh`, which
# prints its own description of the same screen four lines after starting this file, said the true
# one all along. Two files in one directory describing one screen in two contradictory ways, and
# nothing anywhere compared them. The interface's own answer settles it: `writeBlockedReason` in
# `frontend/packages/kernel/src/data/mutation.ts` returns that sentence and `TopicListPage` passes
# it as `disabledReason` on a `disabled` button. The browser is still told the same permission set
# the gateway refuses with; what it does with it is grey the control out and say why, which is the
# more useful of the two behaviours and is why it was chosen.
#
# THIS IS A DEMONSTRATION CONFIGURATION AND ITS PASSWORDS ARE PUBLIC. There is no TLS, the session
# cookie is served without `Secure` so that plain HTTP on localhost works, and the two password
# hashes below are in a public repository. All three are wrong anywhere a network can reach.
#
# ------------------------------------------------------------------------------------------------
# WHAT CHECKS THIS FILE, AND WHAT DOES NOT. Read this before assuming a green build covers it.
#
# CHECKED, AND THE FOURTH ITEM IS NOW TRUE OF THE CODE RATHER THAN OF THE SENTENCE.
# `ShippedConfigurationSuite` in `libs/config` loads this file through the real loader on every
# `./mill libs.config.test`. Each of these was checked by making the edit and running the suite:
#
# ONE OF ITS CASES IS DELIBERATELY RED AT THE MOMENT THE `masking` BLOCK BELOW LANDS, and that is
# the guard working. `the quickstart ships the masking rules its comment describes, and the second
# profile has none` ends by asserting that every OTHER shipped file has no masking rule at all —
# "$relative acquired a masking rule and nothing says why". This file now has one and there is a
# reason, written above the block. Moving that assertion from "no other file" to "no other file
# except this one, for the reason it states" is W11-05's, which owns `libs/config/**`; this file is
# W11-03's. Two files move together and this note is the seam between them.
#
#   * a key spelled wrongly anywhere in the file. The loader refuses any key it does not know, and
#     that is what the row was originally added for.
#   * a TOPIC permission with no `value`. Deleting `value: ".*"` from the `readers` role's TOPIC
#     permission turns the suite red: "kui-quickstart-auth.yaml does not load".
#   * a `callTimeout` that is not shorter than `kui.metrics.scrapeInterval`. Changing the `10s`
#     below to `60s` turns it red with "callTimeout (60 seconds) must be shorter than
#     kui.metrics.scrapeInterval (30 seconds, which is the default)".
#   * an `rbac` role naming a cluster that is not in this file. THIS ONE WAS FALSE FOR TWO WAVES
#     and was corrected in the loader rather than here. Measured before the repair: pointing BOTH
#     roles at `clusters: [no-such-cluster]` left `./mill libs.config.test` at 395/395 with this
#     suite 14/14 green, because nothing cross-referenced `kui.rbac.roles[].clusters` against
#     `kui.clusters[]` at load time -- so both accounts signed in and every screen was empty, which
#     is the demonstration failing in front of whoever is being shown it. Measured after it, on the
#     same edit: `deployment/quickstart/kui-quickstart-auth.yaml loads` fails, reporting BOTH roles
#     at once -- "role 'operators' names 'no-such-cluster', which is not a configured cluster; this
#     file configures quickstart" and the same for 'readers'. The rule is
#     `KuiConfigSource.rolesNameConfiguredClusters`, and it deliberately says nothing about a file
#     with `kui.clusters: []` or about a deployment whose `kui.store` can register a cluster this
#     file has never heard of; both exemptions are stated there and gated in
#     `AuthAndRbacConfigSuite`.
#
# That row was added in wave 5; before it, nothing in this repository read this file at all.
#
# NOT CHECKED, AND IT IS DELIBERATE RATHER THAN AN OVERSIGHT. No CI job runs
# `./docker-compose.auth.yml`, so nothing automated ever signs in as either account, and nothing
# proves that `admin` sees the create-topic button while `viewer` does not. That is the claim this
# file exists to make, and it is made by hand:
#
#     deployment/quickstart/quickstart.sh --with-auth
#
# The reason for leaving it there is cost against coverage, and it is worth stating so that nobody
# adds the job without knowing what they are buying. The `e2e` job already drives a browser against
# the quickstart, and a second one would be a second full stack -- a broker, a registry, a seed run
# and a browser -- for one assertion whose subject, the authorization fold, is covered by
# `services/identity`'s own suites and by `frontend/packages/shell`'s permission-gated rendering.
# What a job here would add over those is the wiring of THIS file to THAT screen, which is one
# `--config` flag in `docker-compose.auth.yml` and the two hashes below.
#
# So: what breaks silently if this file is edited badly is the sign-in itself -- a wrong hash, or a
# `groups:` entry that no `rbac` role names. Change either and run the line above before pushing.
# ------------------------------------------------------------------------------------------------

kui:
  server:
    # Every interface. Binding 127.0.0.1 inside a container makes the process unreachable from
    # outside it, which looks exactly like a crash and is not one.
    host: "0.0.0.0"
    port: 8080
    basePath: "/"

    # Plain HTTP on localhost, so the session cookie cannot carry `Secure` or the browser will
    # refuse to send it back. KUI warns about this on every start and the warning is correct:
    # never set it anywhere a network can reach.
    devInsecureCookies: true

  auth:
    # A login form with two accounts held in this file. The smallest credible deployment: a shared
    # instance with a few named people and no directory server to ask.
    #
    # THE PASSWORDS ARE IN THIS REPOSITORY AND EVERYONE CAN READ THEM. That is fine for a
    # demonstration on a laptop and is wrong anywhere a network can reach. A real deployment writes
    # `passwordHash: "env:KUI_ADA_HASH"` and keeps the hash out of the file; see
    # docs/operations/authentication.md.
    #
    # A hash names its own algorithm, cost and salt, so raising the cost later does not invalidate
    # the hashes already written. Produce one with:
    #
    #     ./mill services.identity.app.runMain kui.identity.app.HashPassword
    #
    # which reads the password from standard input, so it never reaches `ps` or a shell history.
    type: form
    users:
      # Password: quickstart-admin
      - name: admin
        passwordHash: "pbkdf2-sha256$210000$XC3iqjVZVXLOxdQ_XOBsGA$vAP_bescrRwxKG0x2hwV4whRWaghTJZORzHeBiOP76w"
        groups: [operators]
      # Password: quickstart-viewer
      - name: viewer
        passwordHash: "pbkdf2-sha256$210000$0y6raPVUTElFb7dJQAbEVA$AwALno5FnJFzpkRDseIvafLdRJIVhmfF3uve99WIA2A"
        groups: [readers]

  # The same durable metadata store as the no-login quickstart. Principal-scoped settings and alert
  # reads are especially useful here: admin and viewer keep independent state across KUI restarts.
  store:
    topicPrefix: "__kui_"
    replicationFactor: 1
    minInSyncReplicas: 1
    encryptionKey: "env:KUI_STORE_ENCRYPTION_KEY"
    kafka:
      bootstrapServers:
        - "kafka:9092"

  topics:
    # A topic is internal when Kafka says so OR when its name starts with this prefix. The default is
    # `__`, which catches Kafka's own `__consumer_offsets`. The quickstart lowers it to a single
    # underscore because it seeds `_schemas` — the topic Confluent Schema Registry keeps its schemas
    # in — and a single leading underscore is the convention infrastructure topics like that use. With
    # this set, the topics screen shows the ten topics that are yours and hides `_schemas` and
    # `__consumer_offsets` behind the "show internal topics" switch.
    internalPrefix: "_"

  telemetry:
    # Overridden to `text` by the Compose file, because `docker compose logs` is read by a person.
    logFormat: json
    hashUserIds: true

  # ---------------------------------------------------------------------------------------------
  # Where this cluster's broker metrics are read from.
  #
  # `docker-compose.quickstart.yml` runs a Prometheus JMX exporter beside the broker and this is the
  # line that tells KUI about it. Without it every metrics card on the dashboard answers
  # `not_configured` and says so — which is the correct rendering for a deployment that has no
  # exporter, and was for two milestones indistinguishable from KUI not being able to measure
  # anything at all. That is the hole this key closes.
  #
  # `http://` and not a JMX service URL, and it is not a preference: `MetricsSourceSettings.url`
  # is a `SafeUrl`, which ARCHITECTURE.md §14 restricts to `http` and `https`, so
  # `service:jmx:rmi:///jndi/rmi://kafka:9999/jmxrmi` cannot be written here at all. See ADR-050.
  #
  # `kind` is `prometheus`, which is also the default; it is written out because the other value
  # (`jmx`) is declared and deliberately unimplemented, and a reader who finds only one of the two
  # spelled anywhere should be able to see which one this is.
  #
  # `callTimeout` must be shorter than `kui.metrics.scrapeInterval` (30s by default) or the loader
  # refuses the file: a scrape that outlives its interval overlaps the next one.
  metrics:
    sources:
      # The member name is the cluster id below, not a label. A name that does not match a cluster
      # is a source that measures nothing, and the loader says so at start-up rather than leaving a
      # card empty.
      quickstart:
        url: "http://kafka-metrics:5556/metrics"
        kind: prometheus
        callTimeout: "10s"

  # ---------------------------------------------------------------------------------------------
  # WHAT KUI SHOULD NOTICE ABOUT THIS CLUSTER, AND WHEN.
  #
  # There is no on/off switch under `kui.alerts` and there deliberately is not one: every rule the
  # alerts service runs reads a fact this product already measures, so alerting is on in every
  # deployment and the only question is where the lines are drawn. The section is here anyway,
  # spelled out at its own defaults, because the quickstart is what a newcomer copies and a key
  # nobody can see is a key nobody knows they may set.
  #
  # These numbers are local policy rather than truths. A log directory at 80% is a quiet afternoon
  # in one deployment and a page in another, and a consumer group that has been rebalancing for
  # five minutes is either wedged behind a dead member or is a large group doing what large groups
  # do. What is NOT policy is the shape of the answer: a rule whose facts cannot be read says so
  # and contributes no event, rather than reporting a comfortable zero (ADR-053).
  #
  # `diskUsedCriticalPercent` has to stay above `diskUsedWarningPercent` or this file is refused at
  # start-up, because a critical bound below the warning means the warning never fires on the way
  # past it. That refusal is asserted by `ShippedConfigurationSuite`, which loads this file.
  alerts:
    # Seven days. The feed's own reading is about this week -- a relative age, an open count -- and
    # an event store with no upper bound is a slow leak with a calendar.
    retention: "7d"
    # A minute, which is twice the cluster service's own snapshot cadence: evaluating faster than
    # the facts change produces the same answer twice and costs a scrape.
    evaluationInterval: "60s"
    thresholds:
      # One, because a single offline partition is data nobody can read and there is no acceptable
      # number of them. It is a key rather than a constant because a cluster mid-migration can be
      # knowingly noisy for an hour.
      offlinePartitions: 1
      underReplicatedPartitions: 1
      rebalanceDuration: "5m"
      diskUsedWarningPercent: 80
      diskUsedCriticalPercent: 90

  # ---------------------------------------------------------------------------------------------
  # The broker this quickstart starts.
  #
  # `kafka:9092` and not `localhost:9092`: KUI reaches the broker across the Compose network by
  # container name. The port published on your machine is for your own tools.
  #
  # `id` is optional. Without it KUI derives one from the name — `Quickstart (local)` would become
  # `quickstart-local` — and that derived id appears in every URL. Setting it explicitly here means
  # the name can be edited later without breaking a bookmark.
  #
  # There is no `security` block, so this cluster is PLAINTEXT: no authentication and no encryption,
  # which is what the broker this quickstart starts offers. See
  # docs/operations/configuration.md for the SASL and TLS keys a real cluster needs.
  clusters:
    - name: "Quickstart (local)"
      id: "quickstart"
      bootstrapServers:
        - "kafka:9092"

      # The Schema Registry this quickstart starts beside the broker.
      #
      # Setting this is the whole on/off switch for schema-aware decoding on this cluster: with it,
      # KUI fetches each record's schema by the id inside the record and shows the decoded value;
      # without it, an Avro payload has no valid text reading at all and renders as bytes. The
      # address is the Confluent-compatible endpoint of Apicurio Registry — any registry speaking
      # that API works, and `url` may list several addresses for a registry cluster.
      schemaRegistry:
        url:
          - "http://schema-registry:8080/apis/ccompat/v7"

      # The Kafka Connect worker this quickstart starts beside the broker.
      #
      # Setting this is the whole on/off switch for the Connect screens on this cluster, exactly as
      # `schemaRegistry` above is for schema-aware decoding: with it, KUI reads the worker's own
      # REST API and shows the connectors it is running and each task's state; without it the
      # connect service answers `not_configured` and ADR-032's rule hides the row rather than
      # showing one that can never fill.
      #
      # A LIST, because an organisation routinely runs one Connect cluster for sources and another
      # for sinks against the same brokers, and a connector is addressed as (Connect cluster,
      # connector name). `url` inside an entry is a list too: every worker in one Connect cluster
      # serves the same REST API and forwards what it cannot answer itself, so a second address
      # there is failover rather than a second system. This quickstart has one of each.
      #
      # THE WORKER RUNS ONE CONNECTOR, and this comment said it ran none until wave 11. `--with-auth`
      # applies ./docker-compose.auth.yml as an OVERRIDE over ./docker-compose.quickstart.yml, and
      # that override changes two services — which configuration file KUI reads, and the credentials
      # the schema seed signs in with. `connect-seed` is not one of them, so it runs here exactly as it
      # runs in the default quickstart and registers the same connector. The empty-worker state lives
      # in `deployment/compose`, whose worker runs nothing.
      #
      # A comment describing the container topology of a deployment it does not itself define is how
      # this went stale: the sentence was copied from the default file before that file's own seed
      # was written, and nothing compares either of them to `docker-compose.quickstart.yml`.
      connect:
        - name: "quickstart"
          url:
            - "http://kafka-connect:8083"

      # Which serde reads which topic.
      #
      # `defaultValue` is deliberately NOT set to SchemaRegistry here. Three topics exercise the
      # registry's Avro, JSON Schema and Protobuf wire formats; the other topics are plain JSON or
      # text. A per-topic pattern says exactly that, which is also what a mixed real cluster needs.
      #
      # The pattern matches a whole topic name. It selects exactly the three registry fixtures and
      # not a suffix such as `orders.avro.retry`, because resolution anchors the expression.
      serde:
        patterns:
          - serde: SchemaRegistry
            topicValuesPattern: "orders\\.(avro|jsonschema|protobuf)"

      # WHICH FIELDS NEVER LEAVE THE SERVICE IN FULL (DM-001, ADR-023).
      #
      # THE SAME RULES ./kui-quickstart.yaml CARRIES, and THE THING THAT COMPARES THEM IS A TEST,
      # NOT THIS COMMENT: `libs/config/test/src/kui/config/ShippedConfigurationSuite.scala` loads
      # both files through the shipped loader and asserts that the two rule lists agree, field by
      # field, after masking a record with them. Measured on 2026-09-12 by editing the
      # `replacement:` below to "<name>": `./mill --no-daemon libs.config.test` → 395/395, 1
      # FAILED. That is the gate. Everything the rest of this comment publishes is a reader's aid.
      #
      # It is written that way round because this comment has now been wrong twice about the same
      # two blocks. Wave 11 claimed they were "byte for byte" identical, which was false by three
      # lines of explanation — the default file introduces `keep` where it first appears and this
      # one does not, because the reasons are documented once, over there. Wave 12 replaced the
      # claim with a command, and the command could not fail: its `awk` range ended at the first
      # BLANK LINE, and the blank line falls BETWEEN the two rules, so both extracts held the
      # `kind: mask` rule alone and the `kind: replace` rule below was compared with nothing. With
      # the `replacement:` mutated as above, that published diff still printed nothing and exited
      # 0.
      #
      # The range therefore ends where the block ends — at the next line indented less far than
      # the rules — rather than at the first blank line inside it:
      #
      #   ex='/^      masking:/{f=1;print;next} f&&/^ *[^ ]/&&!/^        /{f=0} f'
      #   diff <(awk "$ex" kui-quickstart.yaml      | grep -v '^ *#') \
      #        <(awk "$ex" kui-quickstart-auth.yaml | grep -v '^ *#')
      #
      # is empty — the rules are identical, both of them — and it prints `10c10` naming
      # `replacement:` under the mutation above. The same diff WITHOUT `grep -v` is two hunks,
      # `2,4c2` and `11,12c9,10`, and both are comment: the wave-12 figure of `2,4c2` alone was
      # the first hunk of a range that stopped before the second rule.
      #
      # Until wave 11 the default quickstart masked two fields and this file masked none, so
      # `--with-auth` — the one deployment in this repository that has a role called `viewer`, a
      # person who may read records and may do nothing else — was the one deployment that handed
      # that person every customer's name and email address in full. Nobody
      # decided that; the file was written before the masking block existed and its own header said
      # it was the default file "with nothing else changed", which is how the gap went unread for a
      # wave. `grep -c masking` was 0 here against 6 there.
      #
      # Masking and authorization are different mechanisms and the pairing is the point. RBAC below
      # decides WHICH TOPICS a role may read at all; masking decides WHAT COMES BACK when it does.
      # `readers` may read `customers.profiles` — `value: ".*"` with `MESSAGES_READ` — and a
      # deployment that expected the role to protect the field would have been wrong. Signing in as
      # `viewer` and opening that topic is where the two are visible at once.
      #
      # The rules themselves, and every reason for them, are documented once in
      # ./kui-quickstart.yaml above the same block, and the property to know is repeated here
      # because it is the one an operator gets wrong: A MASKING RULE PROTECTS THE REGISTERED PROFILE
      # IT IS WRITTEN ON AND NOT THE BROKER UNDERNEATH IT. docs/operations/masking.md says so.
      masking:
        # The email address, with enough of its tail left to tell two records apart.
        - kind: mask
          fields: [email]
          keep:
            suffix: 4
          topicValuesPattern: "customers\\.profiles"

        # And the name, which has no useful partial form: a replaced field says plainly that
        # something was hidden, where a masked one can be mistaken for the data itself.
        - kind: replace
          fields: [name]
          replacement: "<redacted>"
          topicValuesPattern: "customers\\.profiles"

  # ---------------------------------------------------------------------------------------------
  # Two roles, so that the difference authorization makes is visible rather than described.
  #
  # `operators` may do everything to the four resources it names below — topics, consumer groups,
  # the cluster's connection settings and Schema Registry subjects. IT IS NOT "EVERYTHING ON THIS
  # CLUSTER", WHICH IS WHAT THIS LINE SAID UNTIL WAVE 12, and the difference is measurable: signed
  # `GET .../connect/connectors` answers **200** with no connector rows: a list filters rather than
  # refuses (ADR-021), and neither role grants `CONNECTOR` `VIEW` or the parent `CONNECT` `VIEW` a
  # connector row falls back to. `POST .../pause` on a connector answers **403**, because no role
  # here grants `CONNECT` `OPERATE`. The 2026-09-12 note that the list body contained the worker's
  # connector recorded the missing row filter, not the role. `KSQL`, `METRICS` and `ALERTS` are
  # three more resources in ADR-021's vocabulary that no role here names. The header at the top of
  # this file carries the decision and what it would take to change it.
  #
  # `readers` may look at topics and read their records, and may do nothing else — no creating a
  # topic, no editing a configuration, no adding partitions, no emptying and no deleting. Signed in
  # as `viewer`, those controls are on the screen and disabled, each saying which of the two reasons
  # applies: the same policy value the gateway refuses with is what `/auth/me` returns to the
  # browser, so the interface greys out exactly what the server would refuse rather than offering a
  # button that fails — and says so, rather than leaving a reader to guess why a control is missing.
  #
  # `provider: FORM` because these people signed in with the form above. `kind: group` matches the
  # `groups:` list on the account. `value` on a permission is a regular expression matched against
  # the whole resource name; a TOPIC permission without one grants nothing at all, which is why the
  # configuration loader refuses it at start-up instead of silently granting nothing.
  # ---------------------------------------------------------------------------------------------
  rbac:
    roles:
      - name: operators
        clusters: [quickstart]
        subjects:
          - provider: FORM
            kind: group
            value: operators
        permissions:
          - resource: TOPIC
            value: ".*"
            actions: [ALL]
          - resource: CONSUMER
            value: ".*"
            actions: [ALL]
          - resource: CLUSTERCONFIG
            actions: [ALL]
          - resource: SCHEMA
            value: ".*"
            actions: [ALL]

      - name: readers
        clusters: [quickstart]
        subjects:
          - provider: FORM
            kind: group
            value: readers
        permissions:
          - resource: TOPIC
            value: ".*"
            actions: [VIEW, MESSAGES_READ]
          - resource: CONSUMER
            value: ".*"
            actions: [VIEW]
