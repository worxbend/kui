# KUI, the simplest thing that works: one cluster, no security.
#
# Copy this file, change the one line that matters (`bootstrapServers`), and start KUI:
#
#     docker run --rm -p 8080:8080 \
#       -v "$PWD/minimal.yaml:/etc/kui/kui.yaml:ro" \
#       ghcr.io/kui/kui-allinone:latest --config /etc/kui/kui.yaml
#
# Then open http://localhost:8080.
#
# Almost every KUI setting has a default that is already right for a single-process, single-broker
# deployment, so this file is short on purpose. Everything omitted here is listed with its default
# in docs/operations/configuration.md.
#
# WHAT YOU WILL SEE: KUI starts, connects to the broker named below, and shows it on the dashboard.
# A broker that is unreachable is not a start-up failure -- the row says `Unavailable` with the
# reason and stays clickable. If one dead broker stopped KUI from starting, one dead broker would
# take the whole console down.

kui:
  # Authentication is disabled. `disabled` is the default, not the only accepted value: `form`
  # and `oidc` load in the all-in-one shape. This line is not strictly required, but writing it
  # down makes the posture explicit. See docs/operations/deployment.md.
  auth:
    type: disabled

  # `text` writes a short human line per event. The default is `json`, which is right for a log
  # system and unreadable in a terminal; this file is for someone watching a terminal.
  telemetry:
    logFormat: text

  # The cluster to manage.
  #
  # No `security` block means PLAINTEXT: no authentication and no encryption. That is right for a
  # broker on your own machine and wrong for anything else; docs/operations/configuration.md has
  # the SASL and TLS keys, one worked example per mode.
  #
  # No `id` either, so KUI derives one from the name: `local`. It appears in every URL. Set `id`
  # explicitly if you expect to rename the cluster later and want the links to keep working.
  clusters:
    - name: "local"
      bootstrapServers: "localhost:9092"
