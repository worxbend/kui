# KUI in its all-in-one shape: the gateway and every service in one container (ADR-005), plus the
# interface, which is its own image in every shape of this product (ADR-048).
#
# THIS IS A DEVELOPMENT ENVIRONMENT, NOT A PRODUCTION DEPLOYMENT. There is no TLS and the session
# cookie is served without `Secure` so that plain HTTP on localhost works.
#
# This is the fastest way to see KUI running: two containers, one of which is a static file server.
#
#   docker compose -f deployment/compose/docker-compose.allinone.yml up -d --wait
#   open http://localhost:8090/ui/
#   docker compose -f deployment/compose/docker-compose.allinone.yml down
#
# What it cannot show you is fault isolation between processes, because the whole backend is one
# process. Use docker-compose.yml for that; see README.md.

name: kui-allinone

services:
  kui:
    image: kui-allinone:${KUI_VERSION:-0.1.0-SNAPSHOT}
    # Built from source: KUI's images are not published to a registry, so without a `build:` stanza
    # `docker compose up` fails immediately — the image name resolves to nothing and the registry
    # has never heard of it. The context is the repository root because the build stage runs
    # `./mill` over the whole tree; `deployment/quickstart/Dockerfile.dockerignore` keeps `out/`,
    # `.git` and every `node_modules` out of that context.
    build:
      context: ../..
      dockerfile: deployment/quickstart/Dockerfile
    container_name: kui-allinone
    command: ["--config", "/etc/kui/kui-allinone.yaml"]
    ports:
      - "${KUI_PORT:-8080}:8080"
    environment:
      # Local demo only: allow integrations registered on the private Docker network.
      KUI_ALLOW_PRIVATE_UPSTREAMS: "true"
      # Human-readable log lines: `docker compose logs` is read by a person here, and the images
      # default to JSON, which is right for a log collector and unreadable for a terminal.
      KUI_TELEMETRY_LOGFORMAT: text
    volumes:
      # `kui-allinone.yaml` and not `kui.yaml`: this shape has no service addresses and no signing
      # keys, and pointing it at the distributed configuration only earns two warnings about the
      # half of the file it is ignoring.
      - ./kui-allinone.yaml:/etc/kui/kui-allinone.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s

  # The interface. One process serving the whole backend still does not serve the browser bundle:
  # since ADR-048 that is a separate image built from the pnpm workspace under `frontend/`, and the
  # all-in-one jar contains none of it. Without this container `/ui/` answers 503 and the fastest
  # way to see KUI running shows nothing.
  #
  # nginx serves /ui/ and proxies /api/ to the container above, so the two share an origin — see
  # ../frontend/README.md for why that one `proxy_pass` is worth a second container.
  kui-frontend:
    image: kui-frontend:${KUI_VERSION:-0.1.0-SNAPSHOT}
    # As above: Mill never builds the browser bundle, so this image is not one of the ones
    # `./mill deployment.docker.__.build` produces and Compose has to build it.
    build:
      context: ../..
      dockerfile: deployment/frontend/Dockerfile
    container_name: kui-allinone-frontend
    ports:
      - "${KUI_FRONTEND_PORT:-8090}:8082"
    environment:
      KUI_GATEWAY_URL: http://kui:8080
      KUI_BASE_PATH: ${KUI_BASE_PATH:-}
      KUI_BUILD_VERSION: ${KUI_VERSION:-0.1.0-SNAPSHOT}
    depends_on:
      kui:
        # nginx resolves `kui` once at start, so a backend that is not there yet is a 502 for ever
        # rather than a slow first request.
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # A mode is needed: the tmpfs is mounted root-owned, this image runs as uid 101, and the
      # entrypoint's write would otherwise fail on a directory that plainly exists.
      - type: tmpfs
        target: /etc/nginx/conf.d
        tmpfs:
          mode: 0777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
