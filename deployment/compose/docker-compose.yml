# KUI in its distributed shape: the interface, the gateway and all nine services as separate
# containers.
#
# The count is prose. `docker compose -f deployment/compose/docker-compose.yml config --services`
# is what actually says how many, and `smoke.sh` compares that set against the gateway's own
# contract map before it starts anything, so neither number has to be remembered here.
#
# THIS IS A DEVELOPMENT AND TEST ENVIRONMENT, NOT A PRODUCTION DEPLOYMENT. The signing key comes
# from an environment variable with a default in this file, there is no TLS, and the session cookie
# is served without `Secure` so that plain HTTP on localhost works. Every one of those is wrong for
# a deployment anyone else can reach.
#
# What it is for is the thing the all-in-one shape cannot demonstrate: real process isolation.
# `docker compose stop kui-cluster` kills an actual process, and the gateway has to keep serving the
# UI and report the cluster service as unavailable rather than falling over with it. That is KUI's
# central promise, and this file is where it stops being a claim. The same is true one service at a
# time for every other one: stopping `kui-topic` must leave the messages and consumer-group screens
# working, which is a stronger statement than "the gateway survives" and is only checkable here.
#
#   docker compose -f deployment/compose/docker-compose.yml up -d --wait
#   open http://localhost:8090/ui/
#   docker compose -f deployment/compose/docker-compose.yml stop kui-cluster
#   docker compose -f deployment/compose/docker-compose.yml start kui-cluster
#   docker compose -f deployment/compose/docker-compose.yml stop kui-topic
#   docker compose -f deployment/compose/docker-compose.yml down -v
#
# Add `-f deployment/compose/docker-compose.observability.yml` to any of those to send both
# processes' traces to a collector that prints them.
#
# See README.md in this directory for what each of those demonstrates.

name: kui

services:
  # ===============================================================================================
  # The interface. Since ADR-048 it is a separate image built from the pnpm workspace under
  # `frontend/`, and the gateway's jar contains none of it — so a stack without this container
  # answers 503 at /ui/ and demonstrates a product nobody can look at.
  #
  # It is a first-class member of this file rather than an overlay because THIS is the stack that
  # grows: M8 added a service beside the ones below and M9 adds two, of which Connect is the first,
  # and every one of them has to work through a browser that is already here. The overlay `../frontend/docker-compose.frontend.yml`
  # stays for the quickstart, whose two halves are deliberately composed at the command line.
  #
  # The browser talks only to this container: nginx serves /ui/ and proxies /api/ to the gateway, so
  # the two share an origin and the session cookie and the CSRF header behave as they do when one
  # process serves both (ADR-019). See ../frontend/README.md.
  # ===============================================================================================
  kui-frontend:
    image: kui-frontend:${KUI_VERSION:-0.1.0}
    # Built from source, because the frontend image is not one of the images
    # `./mill deployment.docker.__.build` produces — Mill never builds the browser bundle, which is
    # the whole point of the two halves being separable. Without this stanza the first
    # `docker compose up` fails on an image name the registry has never heard of.
    build:
      context: ../..
      dockerfile: deployment/frontend/Dockerfile
    container_name: kui-frontend
    ports:
      - "${KUI_FRONTEND_PORT:-8090}:8082"
    environment:
      # A service name on this network, not a published port. The gateway does not have to be
      # reachable from the host at all for the interface to work; it is published below only so a
      # curl against the API is possible.
      KUI_GATEWAY_URL: http://kui-gateway:8080
      KUI_BASE_PATH: ${KUI_BASE_PATH:-}
      KUI_BUILD_VERSION: ${KUI_VERSION:-0.1.0}
    depends_on:
      kui-gateway:
        # A hard gate, unlike every `depends_on` below. nginx resolves `kui-gateway` once at start,
        # so a gateway that is not there yet is a container that answers 502 for ever with nothing
        # to say that waiting would have fixed it. The gateway, in turn, gates on nothing — which
        # is what keeps one service's outage from reaching this page.
        condition: service_healthy
    networks:
      - kui
    # Nothing in a static file server has any business writing to its own image. The entrypoint
    # renders the two per-deployment things — the nginx server block and the page's markers — into
    # tmpfs at start instead.
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # The long form rather than the `tmpfs:` list above, because this one needs a mode: a tmpfs is
      # mounted root-owned, this image runs as uid 101, and the entrypoint's write would otherwise
      # fail with "Permission denied" on a directory that plainly exists.
      - type: tmpfs
        target: /etc/nginx/conf.d
        tmpfs:
          mode: 0777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  # The gateway: the one KUI process the interface talks to, and the only one with an API a browser
  # could reach. Its port is published so that a `curl` against the API is possible from the host;
  # the browser reaches it through `kui-frontend` above.
  kui-gateway:
    image: kui-gateway:${KUI_VERSION:-0.1.0}
    container_name: kui-gateway
    command: ["--config", "/etc/kui/kui.yaml"]
    ports:
      - "${KUI_PORT:-8080}:8080"
    environment:
      # Local demo only: Docker DNS resolves to private addresses checked at connection time.
      KUI_ALLOW_PRIVATE_UPSTREAMS: "true"
      # The shared signing key. Both containers must derive the same bytes from the same string, or
      # every call the gateway makes is refused with a 401 (ADR-020). This is what makes the signed
      # principal path real here rather than only in the unit tests.
      KUI_PRINCIPAL_KEY: ${KUI_PRINCIPAL_KEY:-compose-development-key-not-for-any-real-deployment}
      # Human-readable log lines. `docker compose logs` is read by a person here, not shipped to a
      # log system; the images default to JSON, which is right for the latter and unreadable for
      # the former.
      KUI_TELEMETRY_LOGFORMAT: text
      # Plain HTTP on localhost, so the session cookie cannot carry `Secure` or the browser will
      # refuse to send it back. The gateway warns loudly about this on every start, and the warning
      # is correct: never set it anywhere the network can reach.
      KUI_SERVER_DEVINSECURECOOKIES: "true"
    volumes:
      - ./kui.yaml:/etc/kui/kui.yaml:ro
    # Nothing outside /tmp is ever written. See ../docker/README.md.
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - kui
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      # Every service is listed with the same condition and the same `required: false`, for the
      # reason spelled out under the first of them.
      kui-topic:
        condition: service_healthy
        required: false
      kui-message:
        condition: service_healthy
        required: false
      kui-consumer:
        condition: service_healthy
        required: false
      kui-metrics:
        condition: service_healthy
        required: false
      kui-schema:
        condition: service_healthy
        required: false
      kui-alerts:
        condition: service_healthy
        required: false
      kui-connect:
        condition: service_healthy
        required: false
      kui-cluster:
        # Ordered, not gated. `required: false` means Compose starts the cluster service first and
        # waits for it, but does not refuse to start the gateway when it never becomes healthy.
        #
        # A hard gate here would contradict the gateway's central design property: it has no
        # mandatory upstream, on purpose, because it is the only thing a browser can reach. A
        # gateway that refused to start until every service was healthy would turn one service's
        # outage into a blank page — at exactly the moment an operator needs a working UI to find
        # out what is wrong. The `--scale kui-cluster=0` case in README.md is the test of that.
        condition: service_healthy
        required: false

  # An internal service. It has no published port and must not get one: services are reachable only
  # from inside this network, and only by the gateway, which is the same rule ARCHITECTURE.md §14
  # states for a real deployment.
  kui-cluster:
    image: kui-cluster:${KUI_VERSION:-0.1.0}
    container_name: kui-cluster
    command: ["--config", "/etc/kui/kui-cluster.yaml"]
    environment:
      # Local demo only: permit private endpoints in registered cluster profiles.
      KUI_ALLOW_PRIVATE_UPSTREAMS: "true"
      KUI_PRINCIPAL_KEY: ${KUI_PRINCIPAL_KEY:-compose-development-key-not-for-any-real-deployment}
      KUI_TELEMETRY_LOGFORMAT: text
    volumes:
      - ./kui-cluster.yaml:/etc/kui/kui-cluster.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - kui
    # NO RESTART POLICY, DELIBERATELY. The fault-isolation demo and the E2E test both stop this
    # container and then assert that the UI degrades. A restart policy would race them: the
    # container would come back before the assertion ran, and the test would fail intermittently
    # for a reason nobody would find quickly.
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s

  # The topic service: browsing topics, their partitions and their settings, and administering them.
  #
  # This and the four below follow the cluster service's conventions exactly -- no published port,
  # a mounted read-only configuration, a read-only root filesystem with a tmpfs at /tmp, and no
  # restart policy so that a test which stops one of them can assert what happens next without
  # racing Docker. The one difference from `kui-cluster` is the configuration file: these five share
  # `kui-service.yaml`, because they read the same settings, while the cluster service has its own
  # for the metadata-store section nobody else reads.
  kui-topic:
    image: kui-topic:${KUI_VERSION:-0.1.0}
    container_name: kui-topic
    command: ["--config", "/etc/kui/kui-service.yaml"]
    environment:
      # Local demo only: cluster profiles are fetched over the private Docker network.
      KUI_ALLOW_PRIVATE_UPSTREAMS: "true"
      KUI_PRINCIPAL_KEY: ${KUI_PRINCIPAL_KEY:-compose-development-key-not-for-any-real-deployment}
      # Signs streaming cursors and plan tokens (ADR-026, ADR-045). Every replica of a service must
      # have the same value or a cursor minted by one is refused by another; the three services here
      # share it because the gateway may route two calls of one user's session to two of them.
      KUI_CURSOR_KEY: ${KUI_CURSOR_KEY:-compose-development-cursor-key-not-for-any-real-deployment}
      KUI_TELEMETRY_LOGFORMAT: text
    volumes:
      - ./kui-service.yaml:/etc/kui/kui-service.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - kui
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s

  # The message service: browsing records, producing, resending and purging.
  kui-message:
    image: kui-message:${KUI_VERSION:-0.1.0}
    container_name: kui-message
    command: ["--config", "/etc/kui/kui-service.yaml"]
    environment:
      # Local demo only: cluster profiles and schema registries use private Docker addresses.
      KUI_ALLOW_PRIVATE_UPSTREAMS: "true"
      KUI_PRINCIPAL_KEY: ${KUI_PRINCIPAL_KEY:-compose-development-key-not-for-any-real-deployment}
      # Signs streaming cursors and plan tokens (ADR-026, ADR-045). Every replica of a service must
      # have the same value or a cursor minted by one is refused by another; the three services here
      # share it because the gateway may route two calls of one user's session to two of them.
      KUI_CURSOR_KEY: ${KUI_CURSOR_KEY:-compose-development-cursor-key-not-for-any-real-deployment}
      KUI_TELEMETRY_LOGFORMAT: text
    volumes:
      - ./kui-service.yaml:/etc/kui/kui-service.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - kui
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s

  # The consumer service: consumer groups, their lag and the offset reset.
  kui-consumer:
    image: kui-consumer:${KUI_VERSION:-0.1.0}
    container_name: kui-consumer
    command: ["--config", "/etc/kui/kui-service.yaml"]
    environment:
      # Local demo only: cluster profiles are fetched over the private Docker network.
      KUI_ALLOW_PRIVATE_UPSTREAMS: "true"
      KUI_PRINCIPAL_KEY: ${KUI_PRINCIPAL_KEY:-compose-development-key-not-for-any-real-deployment}
      # Signs streaming cursors and plan tokens (ADR-026, ADR-045). Every replica of a service must
      # have the same value or a cursor minted by one is refused by another; the three services here
      # share it because the gateway may route two calls of one user's session to two of them.
      KUI_CURSOR_KEY: ${KUI_CURSOR_KEY:-compose-development-cursor-key-not-for-any-real-deployment}
      KUI_TELEMETRY_LOGFORMAT: text
    volumes:
      - ./kui-service.yaml:/etc/kui/kui-service.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - kui
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s

  # The schema service: subjects, their versions and the compatibility level each one is under.
  #
  # It is here because the gateway held six service contracts at the time and this was the sixth
  # with no address. Until this container existed `/api/v1/capabilities` answered `cluster consumer message
  # metrics topic`, every schema screen reached a gateway that holds the contract and has nowhere to
  # send it, and the smoke test could not say so -- both sides of its equality simply omitted the
  # service. That is the identical defect `kui-metrics` was added to close one service over, and it
  # survived because the check compared the addresses against the containers and never against the
  # contracts. `smoke.sh` now derives the contract set as well, so the seventh cannot repeat it.
  #
  # `kui-service.yaml` now declares two clusters and names a registry for both, so this process
  # really reaches one and reports both clusters as available. It used to report `not_configured`
  # for a deployment with no clusters at all, and that answer -- correct as it was -- is a different
  # thing again from the 404 a missing container gave.
  kui-schema:
    image: kui-schema:${KUI_VERSION:-0.1.0}
    container_name: kui-schema
    command: ["--config", "/etc/kui/kui-service.yaml"]
    environment:
      # Local demo only: cluster profiles and schema registries use private Docker addresses.
      KUI_ALLOW_PRIVATE_UPSTREAMS: "true"
      KUI_PRINCIPAL_KEY: ${KUI_PRINCIPAL_KEY:-compose-development-key-not-for-any-real-deployment}
      # Carried although this service signs nothing: it mounts the file the other four mount, and
      # that file resolves `kui.streaming.cursorKey` from this variable, so a container without it
      # fails the load rather than ignoring a key it does not read.
      KUI_CURSOR_KEY: ${KUI_CURSOR_KEY:-compose-development-cursor-key-not-for-any-real-deployment}
      KUI_TELEMETRY_LOGFORMAT: text
    volumes:
      - ./kui-service.yaml:/etc/kui/kui-service.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - kui
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s

  # The metrics service: the cluster's throughput, and the four other measurements the dashboard's
  # cards need. It is the eighth service and the newest, and until M7 it was the only one in this
  # file that could not be shown doing anything -- there was no exporter anywhere in the repository
  # for it to read, so every cluster answered `not_configured` and the sentence a card drew when it
  # could not measure something was indistinguishable from the sentence it would draw if KUI could
  # never measure anything.
  #
  # `kafka-metrics` above is what ended that. `kui-service.yaml` names its address under
  # `kui.metrics.sources.measured` and names nothing for `unmeasured`, so this one process answers
  # both ways on one deployment and `smoke.sh` asserts both.
  #
  # It must run whichever way it answers. The gateway derives a service's public routes from the
  # contract it holds *and* the address it was given, so without this container and its `kui.yaml`
  # entry there is no `/api/v1/clusters/*/metrics/*` at all and no `metrics` row in the capability
  # document -- and a card that should have shown its sentence has nothing to read it from. A
  # service that answers honestly and measures nothing is a different thing from a service that is
  # not there, and only one of them is true of this build.
  kui-metrics:
    image: kui-metrics:${KUI_VERSION:-0.1.0}
    container_name: kui-metrics
    command: ["--config", "/etc/kui/kui-service.yaml"]
    # ORDERED AFTER THE EXPORTER, AND THIS IS HEADROOM RATHER THAN A REPAIR. Say which it is,
    # because the last thing written about this line was a repair for a cause that turned out to be
    # false, and it is the only `depends_on` in this file that is about a measurement.
    #
    # Without it, `kui-metrics` starts before `kafka-metrics` -- the exporter waits for the broker's
    # health and this process waits for nothing -- and every scrape it makes in that window fails.
    # Measured on this stack, cold, wave 5: the process starts, its first scrape fails 3s later, and
    # the second one, ~34s after that, succeeds; the first bucket is filled about forty seconds
    # after start. Forced to the worst case -- `kui-metrics` alone for three minutes with no broker
    # and no exporter at all -- it logs five WARNs, `circuit ... is now open`, then `halfopen` and
    # `open` again on each failed probe, and when the exporter finally appears it goes `halfopen`,
    # `closed`, and files a bucket **2 seconds** after Compose called the exporter healthy. The loop
    # retries and the breaker recovers, exactly as it is written to.
    #
    # So the cost this line removes is bounded and it is not a failure: one `resetTimeout` (30s)
    # plus one scrape interval, against `smoke.sh`'s 90s budget. What it buys is that a cold start
    # makes no failed scrape at all, so the WARNs an operator sees on a first `docker compose up`
    # are about something real. `required: false`, like every other entry in this file, because a
    # metrics service that refused to start without its exporter would be the opposite of what this
    # stack demonstrates.
    #
    # AND IT HAS NOW BEEN RUN WITHOUT, which is what "headroom rather than a repair" was still
    # owed. This block was deleted and the stack brought up cold from a torn-down state: healthy in
    # 25s, one WARN from `kui-metrics`, and `buckets carrying a measured rate: yes` 17 seconds
    # after that with no traffic produced at all. A full `smoke.sh` on the same edit PASSED. The
    # wave-4 failure this line was once thought to explain is therefore NOT a start-order problem,
    # and nothing here claims it is any more; see README.md.
    depends_on:
      kafka-metrics:
        condition: service_healthy
        required: false
    environment:
      # Local demo only: live cluster profiles and exporters use private Docker addresses.
      KUI_ALLOW_PRIVATE_UPSTREAMS: "true"
      KUI_PRINCIPAL_KEY: ${KUI_PRINCIPAL_KEY:-compose-development-key-not-for-any-real-deployment}
      # Carried although this service signs nothing: it mounts the file the other three mount, and
      # that file resolves `kui.streaming.cursorKey` from this variable, so a container without it
      # fails the load rather than ignoring a key it does not read.
      KUI_CURSOR_KEY: ${KUI_CURSOR_KEY:-compose-development-cursor-key-not-for-any-real-deployment}
      KUI_TELEMETRY_LOGFORMAT: text
    volumes:
      - ./kui-service.yaml:/etc/kui/kui-service.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - kui
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s

  # The alerts service: the rules KUI runs over facts it already measures, and the feed they open.
  #
  # It is the ninth service and the first one added since the eighth, which is why three literals
  # elsewhere in this repository broke the last time and are named in this wave's guard table. This
  # file is not one of them and that is the point of the arrangement described in the slot below:
  # `smoke.sh` derives the contract set from `ServiceContracts.byService`, the address set from the
  # running gateway and the container set from this file, and CI derives its build list from the
  # `image:` lines here. A service added to those three places is a service every check picks up
  # with nobody remembering anything.
  #
  # It mounts `kui-service.yaml` like the five services above it, and reads one more section of it
  # than they do: `kui.alerts`, whose retention and evaluation interval and thresholds are the
  # numbers its rules compare against. Those thresholds are local policy -- a log directory at 80%
  # is a quiet afternoon in one deployment and a page in another -- so they are configuration and
  # not constants, and this stack sets them explicitly rather than by default so that the file
  # shows an operator what there is to set.
  kui-alerts:
    image: kui-alerts:${KUI_VERSION:-0.1.0}
    container_name: kui-alerts
    command: ["--config", "/etc/kui/kui-service.yaml"]
    environment:
      # Local demo only: live cluster profiles are fetched over the private Docker network.
      KUI_ALLOW_PRIVATE_UPSTREAMS: "true"
      KUI_PRINCIPAL_KEY: ${KUI_PRINCIPAL_KEY:-compose-development-key-not-for-any-real-deployment}
      # Carried for the same reason `kui-schema` carries it: this container mounts the file the
      # other five mount, and that file resolves `kui.streaming.cursorKey` from this variable, so a
      # container without it fails the load rather than ignoring a key it does not read.
      KUI_CURSOR_KEY: ${KUI_CURSOR_KEY:-compose-development-cursor-key-not-for-any-real-deployment}
      KUI_TELEMETRY_LOGFORMAT: text
    volumes:
      - ./kui-service.yaml:/etc/kui/kui-service.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - kui
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s

  # The connect service: the connectors each configured Kafka Connect worker is running, and the
  # three buttons that pause, resume and restart one.
  #
  # It is the tenth service, and the first one whose whole subject is an HTTP upstream that is
  # neither the broker nor the registry. `kafka-connect` below is that upstream, and it is here for
  # exactly the reason `schema-registry` is: the capability document folds the per-cluster rows into
  # one verdict per service (ADR-039 §2, `NotConfigured` beats everything), so a deployment where no
  # cluster names a Connect worker reports the whole service as `not_configured` -- correct, and it
  # would have meant teaching `smoke.sh` to expect a different answer for one of the eleven. Bending
  # the check to fit an incomplete deployment is the wrong repair, which is the sentence
  # `schema-registry` was added under and it has not changed.
  #
  # The worker runs zero connectors and nothing here seeds one. That is a MEASURED empty list --
  # a real worker was asked and named none -- and it is a different answer from `not_configured`
  # (no address configured) and from an upstream that will not answer, which is the distinction this
  # whole product exists to keep. A connector planted to make a screen look busy would destroy it.
  # The ksql service: ksqlDB's streams, tables and queries, one statement at a time, and a push
  # query that is a stream rather than a call.
  #
  # It is the eleventh service and the second whose subject is an HTTP upstream that is neither the
  # broker nor the registry. `ksqldb-server` below is that upstream, and it is here for the reason
  # `schema-registry` and `kafka-connect` are: the capability document folds per-cluster rows into
  # one verdict per service (ADR-039 §2, `NotConfigured` beats everything), so a stack that
  # configured no ksqlDB would report the whole service `not_configured` and `smoke.sh` would have
  # to be taught a different expectation for one of the eleven. Bending the check to fit an
  # incomplete deployment is the wrong repair, and this is the third service that sentence covers.
  #
  # NO `depends_on` ON `ksqldb-server`, and that is a decision rather than an omission. KUI calls
  # ksqlDB when a ksqlDB screen is opened, not at start-up, so ordering the two would change what
  # the first thirty seconds look like and nothing else -- which is exactly what wave 6 measured
  # `kui-metrics`' `depends_on` to be, and it called it headroom. `kui-connect` is in the same
  # position beside `kafka-connect` and also has none. If a ksqlDB screen is opened while the
  # server is still starting, the section says the upstream did not answer, which is true.
  kui-ksql:
    image: kui-ksql:${KUI_VERSION:-0.1.0}
    container_name: kui-ksql
    command: ["--config", "/etc/kui/kui-service.yaml"]
    environment:
      # Local demo only: cluster profiles and ksqlDB use private Docker addresses.
      KUI_ALLOW_PRIVATE_UPSTREAMS: "true"
      KUI_PRINCIPAL_KEY: ${KUI_PRINCIPAL_KEY:-compose-development-key-not-for-any-real-deployment}
      # Carried for the reason the other six that mount this file carry it -- the file resolves
      # `kui.streaming.cursorKey` from this variable, so a container without it fails the load --
      # and for one of this service's own: a statement that drops a stream or a topic is
      # destructive, so it is an ADR-045 plan->token->confirm mutation and this key is what signs
      # the token. It is the first optional service in this stack that actually signs one.
      KUI_CURSOR_KEY: ${KUI_CURSOR_KEY:-compose-development-cursor-key-not-for-any-real-deployment}
      KUI_TELEMETRY_LOGFORMAT: text
    volumes:
      - ./kui-service.yaml:/etc/kui/kui-service.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - kui
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s

  kui-connect:
    image: kui-connect:${KUI_VERSION:-0.1.0}
    container_name: kui-connect
    command: ["--config", "/etc/kui/kui-service.yaml"]
    environment:
      # Local demo only: cluster profiles and Connect use private Docker addresses.
      KUI_ALLOW_PRIVATE_UPSTREAMS: "true"
      KUI_PRINCIPAL_KEY: ${KUI_PRINCIPAL_KEY:-compose-development-key-not-for-any-real-deployment}
      # Carried for the same reason `kui-schema` and `kui-alerts` carry it: this container mounts the
      # file the other six mount, and that file resolves `kui.streaming.cursorKey` from this
      # variable, so a container without it fails the load rather than ignoring a key it does not
      # read. A pause or a restart is audited but carries no ADR-045 plan token -- neither loses
      # anything that cannot be undone by the opposite button -- so nothing here actually signs.
      KUI_CURSOR_KEY: ${KUI_CURSOR_KEY:-compose-development-cursor-key-not-for-any-real-deployment}
      KUI_TELEMETRY_LOGFORMAT: text
    volumes:
      - ./kui-service.yaml:/etc/kui/kui-service.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - kui
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s

  # ===============================================================================================
  # A BROKER, AND THE EXPORTER THAT MAKES IT MEASURABLE.
  #
  # This stack ran with `clusters: []` for three milestones, because its subject is process
  # isolation rather than Kafka and `deployment/quickstart` is where a broker lived. That stopped
  # being tenable with M7: `smoke.sh` now has to assert that a configured cluster's throughput comes
  # back `ok` with real numbers in it, and there is no way to assert that against no broker. A
  # milestone whose only positive assertion is a refusal is a milestone the absence of the code
  # satisfies, which is exactly the trap M7 sat in for two waves.
  #
  # One node, KRaft, no published port. The quickstart publishes 9092 so a person can point their
  # own tools at it; this one is for the two containers below it and nothing else, and not
  # publishing it means this stack and the quickstart can run side by side on one machine.
  # ===============================================================================================
  kafka:
    image: apache/kafka:4.3.1
    container_name: kui-compose-kafka
    environment:
      CLUSTER_ID: kui-compose-000000000001
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      # Single node, so every internal topic has to be happy with one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Remote JMX for the exporter beside it. `KAFKA_JMX_PORT`/`KAFKA_JMX_HOSTNAME` and not a
      # hand-written `KAFKA_JMX_OPTS`, because `kafka-run-class.sh` applies the latter to every tool
      # it launches — including the healthcheck below, which would then try to bind a port the
      # broker already holds. The hostname is what an RMI stub tells the exporter to call back on.
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka
    healthcheck:
      # A real metadata request over the client protocol. A Kafka container reports itself started
      # well before it can answer one, and anything that connects in that window is refused.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 15s
    networks:
      - kui
    restart: unless-stopped

  # The Prometheus JMX exporter. `../metrics/kafka-jmx-exporter.yml` is the same file the quickstart
  # mounts, on purpose: two copies of a metric-name list drift, and the first symptom of the drift
  # is one stack's throughput card filling and the other's staying empty for no visible reason.
  #
  # `kui-service.yaml` names this address under `kui.metrics.sources.measured` and says nothing
  # about the `unmeasured` cluster beside it, which gives `smoke.sh` both halves of the assertion
  # M7 needs: a cluster that answers `ok` with numbers, and a cluster on the same deployment that
  # answers `not_configured`.
  kafka-metrics:
    image: soldevelo/jmx-exporter:1.4.0
    container_name: kui-compose-kafka-metrics
    command: ["5556", "/etc/jmx-exporter/kafka-jmx-exporter.yml"]
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ../metrics/kafka-jmx-exporter.yml:/etc/jmx-exporter/kafka-jmx-exporter.yml:ro
    healthcheck:
      # bash's `/dev/tcp`, because this image carries neither curl nor wget, and `CMD` naming bash
      # explicitly because Compose's `CMD-SHELL` runs dash, which has no `/dev/tcp` at all.
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/5556 && printf 'GET /metrics HTTP/1.0\r\n\r\n' >&3 && grep -q kafka_server_brokertopicmetrics_bytesinpersec <&3"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    networks:
      - kui
    restart: unless-stopped

  # A Schema Registry, because a cluster is now configured and a configured cluster with no registry
  # makes the schema service report `not_configured` for the whole deployment.
  #
  # That report would be correct, and it is why this container is here rather than why it is not.
  # The capability document folds the per-cluster rows into one verdict per service (ADR-039 §2:
  # `NotConfigured` beats everything), so without a registry the schema service's service-level row
  # reads `not_configured` and `smoke.sh`'s "every service the gateway routes is up" loop has to be
  # told to expect a different answer for one of the six. Bending the check to fit an incomplete
  # deployment is the wrong repair: the check is right, and what was missing was the registry.
  #
  # Storage is in memory, which is right for a stack whose whole lifetime is one `smoke.sh` run.
  # Apicurio speaks the Confluent-compatible API at `/apis/ccompat/v7` and is Apache-2.0 throughout
  # (ADR-014 Amendment 1); it is the same image the quickstart already pulls, so this adds no
  # download to a machine that has run either.
  schema-registry:
    image: apicurio/apicurio-registry:3.0.6
    container_name: kui-compose-schema-registry
    environment:
      QUARKUS_PROFILE: prod
    healthcheck:
      # A real call to the API KUI uses, not a port check: the process accepts connections well
      # before Quarkus has finished publishing its routes, and a port check passes in that window.
      test:
        ["CMD-SHELL", "curl -fsS http://localhost:8080/apis/ccompat/v7/subjects >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    networks:
      - kui
    restart: unless-stopped

  # A Kafka Connect worker, for the reason the registry above it is here: `kui-connect` reports what
  # a worker tells it, and without one there is nothing in this stack for it to report.
  #
  # THAT SENTENCE USED TO SAY "a stack with no worker makes the whole service report
  # `not_configured`", AND IT IS FALSE. `not_configured` comes from `kui-service.yaml` naming no
  # `connect:` entry, not from the container being absent. Measured: with this service deleted from
  # this file and both `connect.url` entries left in place, the capability document still reports
  # `connect: available` and the read still answers HTTP 200 with outer status `ok` -- the refusal
  # is reported one level down, in the per-worker section, which is what `smoke.sh` now asserts on
  # and what it could not see while it read the outer status.
  #
  # It is the stock `apache/kafka` image running `connect-distributed.sh`, which is the same image
  # this file already pulls for the broker -- so it adds a container and no download. The shipped
  # `connect-distributed.properties` already sets every `*.storage.replication.factor` to 1, which
  # is what a single-node broker needs, so the only thing rewritten is `bootstrap.servers` and the
  # consumer group the three internal topics are coordinated under. The rewrite is a `sed` into
  # /tmp rather than a mounted properties file, because a fourth configuration file in this
  # directory would be one more thing `ShippedConfigurationSuite` has to be told is not KUI's.
  #
  # `plugin.discovery=hybrid_warn` because this worker has no plugin path of its own: the only
  # connectors on its classpath are the MirrorMaker ones the image ships, none of which is started.
  # Without it the worker logs a migration error about plugins it does not have.
  #
  # NOTHING PRODUCES A CONNECTOR HERE AND NOTHING SHOULD -- in THIS stack. `GET
  # /connectors?expand=status` answers `{}` and that is the honest state of a worker nobody has
  # configured; `smoke.sh` asserts that every worker this cluster names answered `ok` rather than
  # that it found something, exactly as the alerts feed is asserted on `evaluatedAt` and its rule
  # list rather than on having opened an event.
  #
  # The quickstart is the other half of that pair and it does register one, because the two positive
  # cases in `frontend/e2e/connect.spec.ts` -- a connector's rows, a task's state -- had nothing to
  # run against and skipped. The empty-worker answer is this stack's to keep; the busy-worker answer
  # is the quickstart's. Seeding one HERE would leave the empty state covered nowhere.
  kafka-connect:
    image: apache/kafka:4.3.1
    container_name: kui-compose-kafka-connect
    # ORDERED AFTER THE BROKER, AND THIS IS HEADROOM RATHER THAN A REPAIR -- run in both directions
    # before the line was written, because the last `depends_on` in this file to be described as a
    # repair turned out not to be one (see `kui-metrics` above, and house rule 9).
    #
    # Measured on this machine, cold from a torn-down stack, `up -d --wait` three times:
    #
    #   with this block:     healthy in 41s and 38s, 15 WARN/ERROR lines from the worker, none of
    #                        them about reaching the broker
    #   without this block:  healthy in 35s, 38 WARN/ERROR lines, 23 of them
    #                        `Connection to node -1 (kafka:9092) could not be established`
    #
    # So dropping it costs nothing the stack notices: Connect's admin client retries, the worker
    # comes up, `GET /connectors` answers, and `smoke.sh`'s connect assertion passes either way. What
    # the block buys is that a cold `docker compose up` produces no WARN about a broker that was
    # simply not started yet, so the warnings an operator does see are about something real. It is
    # not `required: false` only because this is a third-party container with no KUI opinion about
    # partial availability; the broker is genuinely the only thing it needs.
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        sed -e 's|^bootstrap.servers=.*|bootstrap.servers=kafka:9092|' \
            -e 's|^group.id=.*|group.id=kui-compose-connect|' \
            /opt/kafka/config/connect-distributed.properties > /tmp/connect-distributed.properties
        printf 'listeners=http://:8083\nplugin.discovery=hybrid_warn\n' >> /tmp/connect-distributed.properties
        exec /opt/kafka/bin/connect-distributed.sh /tmp/connect-distributed.properties
    healthcheck:
      # bash's `/dev/tcp` and `CMD` naming bash explicitly, for the reason `kafka-metrics` gives:
      # this image carries neither curl nor wget, and Compose's `CMD-SHELL` runs dash, which has no
      # `/dev/tcp` at all. A real GET of the REST resource KUI reads rather than a port check --
      # Jetty accepts connections before Connect has finished publishing its routes.
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/8083 && printf 'GET /connectors HTTP/1.0\r\n\r\n' >&3 && grep -q '200 OK' <&3"
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 15s
    networks:
      - kui
    restart: unless-stopped

  # A ksqlDB server, for the reason `kafka-connect` above it is here: `kui-ksql` reports what a
  # ksqlDB server tells it, and without one there is nothing in this stack for it to report.
  #
  # THE IMAGE IS NOT APACHE-2.0 AND THAT IS WORTH SAYING OUT LOUD. ADR-014 Amendment 1 chose
  # Apicurio over Confluent's Schema Registry precisely to keep this repository's runnable stacks on
  # Apache-licensed images, and it could do that because two implementations of that API exist.
  # There is no second implementation of ksqlDB: `confluentinc/ksqldb-server` under the Confluent
  # Community License is the only thing that speaks it. So this container is the one exception, it
  # is a development stack rather than anything shipped, and KUI's own code has no dependency on
  # which server answers -- it speaks the REST API and would speak to any other implementation of
  # it, if one existed.
  #
  # `KSQL_KSQL_SERVICE_ID` is not decoration: it prefixes the internal command topic, and two
  # servers sharing one broker with the same id would share a command topic and be one cluster.
  # `KSQL_KSQL_STREAMS_*_REPLICATION_FACTOR` and the min-ISR are here because this broker is a
  # single node and the defaults are 1 for replication but not for the internal topic's ISR, which
  # otherwise refuses to create it.
  ksqldb-server:
    image: confluentinc/ksqldb-server:0.29.0
    container_name: kui-compose-ksqldb
    # ORDERED AFTER THE BROKER, copied from the Connect worker above, and NOT re-measured for this
    # container. The worker's block records a measurement in both directions -- with and without the
    # `depends_on`, three cold `up -d --wait` runs each -- and concludes it is headroom, not a
    # repair. The same argument applies here (ksqlDB's clients retry, and `smoke.sh` asks nothing of
    # this server until the stack is up), but the same argument is not the same measurement, and
    # house rule 9 is that a root cause is not established until it has been run in both directions.
    # So: this line is headroom by inheritance, it has not been shown to be one here, and whoever
    # wants to remove it should run it rather than reason about it.
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KSQL_BOOTSTRAP_SERVERS: kafka:9092
      KSQL_LISTENERS: http://0.0.0.0:8088
      KSQL_KSQL_SERVICE_ID: kui-compose-
      KSQL_KSQL_STREAMS_REPLICATION_FACTOR: 1
      KSQL_KSQL_INTERNAL_TOPIC_REPLICAS: 1
      KSQL_KSQL_INTERNAL_TOPIC_MIN_INSYNC_REPLICAS: 1
    healthcheck:
      # A real GET of `/info`, which is the resource KUI's adapter reads first, rather than a port
      # check: Jetty accepts connections well before ksqlDB has finished starting its engine, and a
      # port check passes inside that window. This image is Debian-based and carries curl, unlike
      # the Kafka image two blocks up.
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/info"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 20s
    networks:
      - kui
    restart: unless-stopped

  # ===============================================================================================
  # THE SLOT FOR THE ONE SERVICE THAT DOES NOT EXIST YET.
  #
  # M9's other half adds `services/ksql` (docs/plan/ROADMAP.md); M9 was split, and Connect above is
  # the half that landed first. It is a container exactly like
  # `kui-consumer` above: no published port, `kui-service.yaml` mounted read-only, a read-only root
  # with a tmpfs at /tmp, and no restart policy so a test that stops it can assert what happens next
  # without racing Docker.
  #
  # The name and the address are decided HERE, once, rather than twice by two people:
  #
  #   service    container       address on this network     configuration
  #   ---------  --------------  --------------------------  ---------------------------------
  #   ksql       kui-ksql        http://kui-ksql:8080        kui-service.yaml
  #
  # Every service listens on 8080 INSIDE its own container and publishes nothing, so there is no
  # port to allocate and no collision to think about: the container name is the address. That is
  # the same rule ARCHITECTURE.md §14 states for a real deployment.
  #
  # Adding one is three edits and no reshaping: copy `kui-consumer` above and change the two names,
  # add the matching `kui.gateway.services.<id>` block to `kui.yaml`, and add a `depends_on` entry
  # under `kui-gateway` with `condition: service_healthy` and `required: false` — the same
  # ordered-not-gated relationship every service already has, for the reason spelled out there.
  #
  # There is a FOURTH edit whenever the new service's whole subject is an upstream this stack does
  # not already run, and `kui-connect` is what taught it: `kafka-connect` had to be added beside the
  # service, because a deployment where no cluster configures a worker makes the capability
  # document report the whole service `not_configured`, and `smoke.sh`'s "every routed service is
  # available" loop is right to refuse that. `services/ksql` will need a ksqlDB server for the same
  # reason. `kui-schema` and `schema-registry` are the older worked example of the same pairing.
  #
  # `kui-metrics`, `kui-alerts` and `kui-connect` above are that recipe already applied: each was a
  # row in this table until its service had an image to run. All three rows are gone from it,
  # because the addresses they named are live containers a little way up this file, and a slot that
  # still listed one would be a plan for something already built.

networks:
  kui:
    driver: bridge
