# The reference KUI configuration.
#
# This is the file the Docker Compose topology mounts into every process (INFRA-002), and it is
# also the worked example `docs/operations/configuration.md` describes key by key. Everything here
# is a value KUI would have used anyway: the file exists to show the shape and to give an operator
# something to copy, not to change any default.
#
# Every key can also be set as an environment variable or a command-line flag. The environment name
# is the key in capitals with the dots replaced by underscores (`kui.server.port` becomes
# `KUI_SERVER_PORT`), and the flag is the key itself (`--kui.server.port=9090`). Flags beat the
# environment, the environment beats this file, and this file beats the built-in defaults.

kui:
  server:
    # 0.0.0.0 means "every network interface", which is what a container needs: binding 127.0.0.1
    # inside a container makes the process unreachable from outside it.
    host: "0.0.0.0"
    port: 8080
    # The path prefix everything is served under. "/" means no prefix. Set this to, say, "/kui"
    # when a reverse proxy mounts KUI on a sub-path of a shared host name.
    basePath: "/"

  gateway:
    # The other KUI services, by service id. In the all-in-one deployment this section is empty,
    # because the gateway calls the services in its own process. The Compose topology runs them as
    # separate containers, so each one needs an address.
    services:
      cluster:
        url: "http://kui-cluster:8080"
        # The whole-call budget. A caller may assume no upstream call ever takes longer than this.
        timeout: "10s"
        # The bulkhead: how many calls to this service may be in flight at once. It is what stops
        # one slow service from consuming every thread and taking the others down with it.
        maxConcurrent: 32
      topic:
        url: "http://kui-topic:8080"
        timeout: "10s"
        maxConcurrent: 32
      message:
        # A longer budget than the others, and deliberately so: a browse holds the connection open
        # while it polls a Kafka topic for records that may not have arrived yet, so ten seconds
        # would turn an empty topic into a timeout rather than an empty page.
        url: "http://kui-message:8080"
        timeout: "60s"
        maxConcurrent: 32
      consumer:
        url: "http://kui-consumer:8080"
        timeout: "10s"
        maxConcurrent: 32
      # The metrics service measures nothing in this build — there is no JMX client and no
      # Prometheus parser — so every one of its answers is a 200 saying `not_configured`. It is
      # addressed here anyway, because the gateway derives a service's public routes from the
      # contract it holds *and* the address it was given: with no entry here it holds the metrics
      # contract and publishes none of it, so the dashboard's cards have nothing to read their
      # "not measured" sentence from and show an outage instead. The two look different on screen
      # and mean different things.
      metrics:
        url: "http://kui-metrics:8080"
        timeout: "10s"
        maxConcurrent: 32
      # The sixth contract the gateway holds, and for one milestone the last one. It was missing
      # from this list for a whole milestone: `services/schema` was in `ServiceContracts.byService`,
      # had a container image nothing built, and appeared in neither this file nor
      # `docker-compose.yml` — so the gateway published none of its routes and every schema screen
      # reached a 404. That is the same defect the `metrics` block above was written to close, one
      # service over, and it survived because the smoke test compared the configured addresses
      # against the running containers and never against the contracts. It now derives all three
      # sets, so an unaddressed contract fails the stack rather than quietly costing a screen.
      schema:
        url: "http://kui-schema:8080"
        timeout: "10s"
        maxConcurrent: 32
      # The seventh, and the ninth service KUI has. The feed is a read of an in-memory event store
      # and the acknowledgement is one write, so ten seconds is generous rather than tight; the
      # bulkhead is the same 32 as everything except the message service, which is the only one
      # that holds a connection open while a broker decides whether it has anything to send.
      #
      # An address here and a container in `docker-compose.yml` are two of the three facts a
      # service needs to be reachable. The third is the contract in `ServiceContracts.byService`,
      # and `smoke.sh` reads all three before it starts anything, because a contract with no
      # address is absent from BOTH sides of an addresses-against-containers comparison -- which is
      # how the metrics service and then the schema service each went a milestone unreachable.
      alerts:
        url: "http://kui-alerts:8080"
        timeout: "10s"
        maxConcurrent: 32
      # The eighth address, and the tenth service KUI has. Every read is one call to a Connect
      # worker's REST API and every write is one more, so ten seconds is the same budget the topic
      # and consumer services get; the message service's sixty is for the one endpoint that holds a
      # connection open while a broker decides whether it has anything to send, and nothing here
      # does that. Connect publishes no change feed of its own, so unlike alerts this service has no
      # stream to relay and there is nothing here that outlives a request.
      #
      # The three facts a service needs to be reachable are this address, a container in
      # `docker-compose.yml`, and the contract in `ServiceContracts.byService`. `smoke.sh` reads all
      # three before it starts anything -- and its failure message now says which of the three is
      # missing, because in wave 6 it fired with the container and the address both present and
      # named the two that were there.
      connect:
        url: "http://kui-connect:8080"
        timeout: "10s"
        maxConcurrent: 32
      # The ninth address, and the eleventh service KUI has. Listing objects and running one
      # statement are ordinary calls against ksqlDB's REST API, so the budget is the same ten
      # seconds the topic, consumer and connect services get.
      #
      # A PUSH QUERY IS NOT COVERED BY THIS TIMEOUT AND MUST NOT BE. It is a stream: it does not
      # finish, and a request budget applied to it would cut every one of them off at ten seconds.
      # The gateway carries it through a hand-written relay rather than through the derived proxy,
      # exactly as the alerts feed and the message browse are carried, and the budget it runs under
      # is `kui.clusters[].ksql.streamTimeout` in `kui-service.yaml` -- one key per promise, which
      # is the distinction `KsqlSettings` exists to keep.
      #
      # The three facts a service needs to be reachable are this address, a container in
      # `docker-compose.yml`, and the contract in `ServiceContracts.byService`; `smoke.sh` reads all
      # three before it starts anything.
      ksql:
        url: "http://kui-ksql:8080"
        timeout: "10s"
        maxConcurrent: 32

    # How often the gateway asks each service whether it is ready, to keep the capability registry
    # (and therefore the greyed-out parts of the UI) current.
    readinessIntervalMs: 10000

    # The keys the gateway signs the `X-Kui-Principal` header with (ADR-020). Several may be listed
    # so a key can be rotated without downtime: the newest one whose `notBefore` has passed is used
    # for signing, and services keep accepting the older ones until they are removed here.
    #
    # `key` accepts a literal, `env:NAME` or `file:/path`. Use one of the latter two in any real
    # deployment: a literal here means the secret is in version control.
    principalKeys:
      - kid: "compose-1"
        key: "env:KUI_PRINCIPAL_KEY"
        notBefore: "2026-01-01T00:00:00Z"

    # Cross-origin resource sharing is off, and should stay off for the shipped deployment: the
    # gateway serves the single-page application itself, so the browser and the API are the same
    # origin and CORS is not involved. Turn it on only to let some other site call this API, and
    # then list the origins explicitly — "*" is refused at startup.
    cors:
      enabled: false
      origins: []

  auth:
    # Disabled for this local stack. `form` and `oidc` also load; they do not fail startup. This
    # distributed file configures no identity service, so leave `disabled` here. See
    # docs/operations/deployment.md.
    type: disabled

  telemetry:
    # Where traces and metrics are exported. Comment it out and the process still starts and still
    # serves: a monitoring outage must never take KUI down.
    # otlpEndpoint: "http://otel-collector:4317"

    # An extra port serving *this process's own* telemetry in Prometheus format. This is not the
    # product's Kafka-cluster metrics endpoint; ADR-009 keeps those two deliberately separate.
    # prometheusPort: 9464

    # json for machines, text for a human reading a terminal.
    logFormat: json

    # Log and trace `user.id` as a hash rather than the login name. An operator debugging a request
    # almost never needs to know who it was, only that two entries concern the same person.
    hashUserIds: true

  # Declared so the shape exists. Nothing reads them yet: the cluster registry arrives in M1 and
  # the authorization model in M6. Keys placed under them are accepted and ignored; keys anywhere
  # else that KUI does not recognise fail the load.
  clusters: []
  rbac: {}
