# The seven packages of DEVPLAN §6.1. One package per current Mill module, so the module
# boundary survives the port: pnpm's strict node_modules makes an undeclared import a build
# failure, which is the closest equivalent to Mill's `moduleDeps` (ADR-048, decision D5/D11).
packages:
  - "packages/*"

allowBuilds:
  # esbuild ships a platform-specific binary that its install script links into place.
  # Vite's dependency pre-bundler needs it; without it Storybook's dev server cannot start.
  esbuild: true

# Every runtime dependency is hoisted to exactly one copy. Two copies of the Solid reactive
# core in one bundle is the framework's classic failure mode (ADR-048 §7 R-7).
dedupePeerDependents: true

# openapi-typescript's Redocly parser accepts this patch release without an API change. Keep the
# generator off GHSA-2883-xcg3-v3hh until its parent raises its own lower bound.
#
# Solid 2.0.0-rc.6 pins seroval ~1.5.4, and every 1.5.x is open to GHSA-p6vx-979v-rg4c (critical)
# and GHSA-jp82-f5mq-hwhp. Solid rc.8 itself moved to seroval ~1.6.7, but bumping Solid pulls
# @solidjs/signals rc.15 and breaks the runtime (setConsoleFooter), so lift seroval alone until the
# pinned prerelease Solid moves past rc.6 (see package.json kui.pinnedPrereleaseDependencies).
overrides:
  js-yaml: 4.3.2
  seroval: 1.6.10
  seroval-plugins: 1.6.10

minimumReleaseAgeExclude:
  - playwright-core@1.63.0
  - playwright@1.63.0
  - '@playwright/test@1.63.0'
