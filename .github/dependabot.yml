version: 2

# Pinning CI dependencies to commits removes mutable code from privileged jobs. Dependabot keeps
# those pins maintainable by proposing the reviewed SHA behind each new release. The frontend entry
# does the same for the one lockfile this repository owns; Scala/Mill dependencies remain subject to
# the normal reviewed build.mill update because GitHub has no Mill ecosystem updater.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 5
    versioning-strategy: increase

  # The nginx runtime stages are pinned by digest, which freezes them until something proposes the
  # next one; that is this entry. Node is left out: the build stages carry .tool-versions' number,
  # mirrored by hand into ci.yml, and a bump made here alone would split them.
  - package-ecosystem: docker
    directories:
      - /deployment/frontend
      - /deployment/storybook
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: node
