bootstrap.servers=broker-1:9093,broker-2:9093
client.id=kui-admin-golden
sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required clientId="golden-user" clientSecret="golden-secret" scope="kafka:read";
sasl.login.callback.handler.class=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginCallbackHandler
sasl.mechanism=OAUTHBEARER
sasl.oauthbearer.token.endpoint.url=https://idp.example.com/oauth2/token
security.protocol=SASL_SSL
ssl.endpoint.identification.algorithm=https
